<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://unpkg.com/globe.gl@2.26.0/dist/globe.gl.min.js"></script>
</head>
<body>

    <div id="globeViz"></div>

    <script>
        // 画像（テクスチャ）を一切使わず、単色でシンプルな球体をベースにする
        const myGlobe = Globe()(document.getElementById('globeViz'))
            .backgroundColor('#000000')   // 背景（宇宙）の色
            .baseColor('#111111')         // 地球（海）の色を暗いグレーに設定
            .showAtmosphere(true)         // 輪郭をわかりやすくするために大気圏エフェクトを有効化
            .atmosphereColor('#3a86ff');  // 大気圏の色を青に

        // カメラの初期距離（地球が画面に収まるサイズ）
        myGlobe.pointOfView({ alt: 2.5 });
    </script>
</body>
</html>
