<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D世界空港地球儀マップ</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050510;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globe-container { width: 100%; height: 100%; }
        /* 画面中央上部の国名・空港案内吹き出し */
        #tooltip {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%); background: rgba(10, 16, 36, 0.9);
            color: #fff; padding: 12px 30px; border-radius: 30px;
            font-size: 16px; font-weight: bold; border: 1px solid #00aaff;
            pointer-events: none; z-index: 1000; display: none;
            box-shadow: 0 4px 25px rgba(0,170,255,0.4); text-align: center;
        }
    </style>
</head>
<body>

    <div id="tooltip"></div>
    <div id="globe-container"></div>

    <script>
        // --- 📊 全世界の主要空港データ ---
        const airportData = [
            { name: "東京国際空港（羽田）", iata: "HND", country: "JP", lat: 35.549, lon: 139.780 },
            { name: "成田国際空港", iata: "NRT", country: "JP", lat: 35.772, lon: 140.393 },
            { name: "関西国際空港", iata: "KIX", country: "JP", lat: 34.432, lon: 135.230 },
            { name: "仁川国際空港", iata: "ICN", country: "KR", lat: 37.460, lon: 126.440 },
            { name: "台湾桃園国際空港", iata: "TPE", country: "TW", lat: 25.079, lon: 121.234 },
            { name: "北京首都国際空港", iata: "PEK", country: "CN", lat: 40.079, lon: 116.603 },
            { name: "上海浦東国際空港", iata: "PVG", country: "CN", lat: 31.144, lon: 121.808 },
            { name: "香港国際空港", iata: "HKG", country: "HK", lat: 22.308, lon: 113.914 },
            { name: "シンガポール・チャンギ空港", iata: "SIN", country: "SG", lat: 1.350, lon: 103.994 },
            { name: "スワンナプーム国際空港", iata: "BKK", country: "TH", lat: 13.690, lon: 100.750 },
            { name: "シドニー国際空港", iata: "SYD", country: "AU", lat: -33.946, lon: 151.177 },
            { name: "ジョン・F・ケネディ国際空港", iata: "JFK", country: "US", lat: 40.640, lon: -73.779 },
            { name: "ロサンゼルス国際空港", iata: "LAX", country: "US", lat: 33.942, lon: -118.408 },
            { name: "ロンドン・ヒースロー空港", iata: "LHR", country: "GB", lat: 51.470, lon: -0.454 },
            { name: "パリ＝シャルル・ド・ゴール空港", iata: "CDG", country: "FR", lat: 49.010, lon: 2.550 },
            { name: "フランクフルト空港", iata: "FRA", country: "DE", lat: 50.033, lon: 8.570 },
            { name: "ドバイ国際空港", iata: "DXB", country: "AE", lat: 25.253, lon: 55.364 }
        ];

        const iso3ToIso2 = { "JPN":"JP","KOR":"KR","TWN":"TW","CHN":"CN","HKG":"HK","MAC":"MO","SGP":"SG","THA":"TH","MYS":"MY","IDN":"ID","PHL":"PH","VNM":"VN","KHM":"KH","LAO":"LA","MMR":"MM","IND":"IN","LKA":"LK","MDV":"MV","AUS":"AU","NZL":"NZ","FJI":"FJ","USA":"US","CAN":"CA","MEX":"MX","PAN":"PA","COL":"CO","PER":"PE","BRA":"BR","ARG":"AR","CHL":"CL","GBR":"GB","FRA":"FR","DEU":"DE","NLD":"NL","BEL":"BE","CHE":"CH","ESP":"ES","PT":"PT","IT":"IT","AT":"AT","DNK":"DK","SWE":"SE","NOR":"NO","FIN":"FI","GRC":"GR","TUR":"TR","RUS":"RU","ARE":"AE","QAT":"QA","SAU":"SA","EGY":"EG","ZAF":"ZA","ETH":"ET","KEN":"KE","MAR":"MA" };

        // --- 3D空間の基本セットアップ ---
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
        camera.position.z = 250;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        // --- 地球球体の自前生成 ---
        const GLOBE_RADIUS = 80;
        const globeGroup = new THREE.Group(); // 地球、国境、ピンをすべてまとめるグループ
        scene.add(globeGroup);

        // 海の球体を作成
        const sphereGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
        const sphereMat = new THREE.MeshPhongMaterial({ color: 0x0a1625, shininess: 10 });
        const earthMesh = new THREE.Mesh(sphereGeo, sphereMat);
        globeGroup.add(earthMesh);

        // 緯度経度を3D空間のXYZ座標に変換するヘルパー関数
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -(radius * Math.sin(phi) * Math.sin(theta)),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.cos(theta)
            );
        }

        // --- 国境データの読み込みと3Dメッシュ化 ---
        let countriesData = [];
        const countryMeshes = []; // マウス判定用の国メッシュ
        const pinGroup = new THREE.Group(); // 空港ピン用のグループ
        globeGroup.add(pinGroup);

        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
            .then(res => res.json())
            .then(geojson => {
                countriesData = geojson.features;
                
                geojson.features.forEach((feature) => {
                    if (!feature.geometry) return;

                    const iso3 = feature.properties.ISO_A3 || "";
                    const iso2 = iso3ToIso2[iso3] || "";
                    const name = feature.properties.NAME || "不明な国";

                    // 国境線を描画するためのポイント群を生成
                    const coords = feature.geometry.coordinates;
                    const type = feature.geometry.type;

                    const polygons = type === 'Polygon' ? [coords] : coords;

                    polygons.forEach(polygon => {
                        polygon.forEach(ring => {
                            const points = [];
                            ring.forEach(pt => {
                                // わずかに海より高く浮かせる(半径+0.2)
                                points.push(latLonToVector3(pt[1], pt[0], GLOBE_RADIUS + 0.2));
                            });
                            
                            // 国境線の作成
                            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                            const lineMat = new THREE.LineBasicMaterial({ color: 0x3a4f66 });
                            const line = new THREE.Line(lineGeo, lineMat);
                            globeGroup.add(line);
                        });
                    });

                    // マウスホバー判定（Raycast）用に、国のだいたいの中心に透明な衝突判定用見えない球体を配置
                    // (※本来はポリゴンを貼るべきですが、CORSエラーを避けて軽量かつ確実に動かすための設計です)
                    if (polygons[0] && polygons[0][0] && polygons[0][0][0]) {
                        const samplePt = polygons[0][0][0];
                        const centerVec = latLonToVector3(samplePt[1], samplePt[0], GLOBE_RADIUS);
                        const proxyGeo = new THREE.SphereGeometry(12, 16, 16);
                        const proxyMat = new THREE.MeshBasicMaterial({ visible: false }); // 完全に透明
                        const proxyMesh = new THREE.Mesh(proxyGeo, proxyMat);
                        proxyMesh.position.copy(centerVec);
                        
                        // 判定用データをメッシュに仕込む
                        proxyMesh.userData = { name: name, iso2: iso2, countryData: feature };
                        scene.add(proxyMesh); // レイキャスト用にシーンに直接追加
                        countryMeshes.push(proxyMesh);
                    }
                });
            });

        // --- 空港ピン・文字盤を自前で描画する関数 ---
        function createAirportPins(countryCode) {
            // 前のピンを一度すべて消す
            while(pinGroup.children.length > 0){
                pinGroup.remove(pinGroup.children[0]);
            }

            const localAirports = airportData.filter(ap => ap.country === countryCode);
            
            localAirports.forEach(ap => {
                const pinPos = latLonToVector3(ap.lat, ap.lon, GLOBE_RADIUS + 1);

                // ① 赤いピン（小さな球体）
                const pinGeo = new THREE.SphereGeometry(1.2, 8, 8);
                const pinMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
                const pinMesh = new THREE.Mesh(pinGeo, pinMat);
                pinMesh.position.copy(pinPos);
                pinGroup.add(pinMesh);

                // ② 空港名のテキストを3D空間上の2D看板（Sprite）として描画
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.font = 'Bold 24px sans-serif';
                ctx.fillStyle = '#ffaa00';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.strokeText(`${ap.name} [${ap.iata}]`, 10, 40);
                ctx.fillText(`${ap.name} [${ap.iata}]`, 10, 40);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.copy(latLonToVector3(ap.lat, ap.lon, GLOBE_RADIUS + 6));
                sprite.scale.set(40, 5, 1); // 看板のサイズ
                pinGroup.add(sprite);
            });
        }

        // --- マウスホバー連動の処理（Raycaster） ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let currentHovered = null;
        const tooltip = document.getElementById('tooltip');

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(countryMeshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                if (currentHovered !== hitMesh) {
                    currentHovered = hitMesh;
                    
                    const data = hitMesh.userData;
                    
                    // 吹き出しを表示
                    tooltip.innerHTML = `🌍 ${data.name} (${data.iso2})`;
                    tooltip.style.display = 'block';

                    // 空港ピンを動的に生成
                    if (data.iso2) {
                        createAirportPins(data.iso2);
                    }
                }
            } else {
                if (currentHovered !== null) {
                    currentHovered = null;
                    tooltip.style.display = 'none';
                    // ピンを全部消去
                    while(pinGroup.children.length > 0){
                        pinGroup.remove(pinGroup.children[0]);
                    }
                }
            }
        });

        // --- 地球をマウスドラッグで回転させる処理 ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        container.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('mousemove', (e) => {
            const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
            if (isDragging) {
                globeGroup.rotation.y += deltaMove.x * 0.005;
                globeGroup.rotation.x += deltaMove.y * 0.005;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        // マウスホイールによるズーム倍率調整
        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.2;
            camera.position.z = Math.max(130, Math.min(400, camera.position.z));
        });

        // --- アニメーションループ（常時更新・自転） ---
        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging && !currentHovered) {
                globeGroup.rotation.y += 0.002; // 放置されているときは自動で自転
            }
            renderer.render(scene, camera);
        }
        animate();

        // ウィンドウサイズが変わった時のリサイズ追従
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

    </script>
</body>
</html>
