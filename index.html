<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D世界空港地球儀マップ</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030408; /* 宇宙空間 */
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globe-container {
            width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center;
        }
        path, circle, text, svg {
            outline: none !important;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        /* 画面中央上部の国名吹き出し */
        #tooltip {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%); background: rgba(10, 16, 35, 0.95);
            color: #fff; padding: 10px 35px; border-radius: 30px;
            font-size: 18px; font-weight: bold; border: 1px solid #00aaff;
            pointer-events: none; z-index: 1000; display: none;
            box-shadow: 0 4px 25px rgba(0,170,255,0.4); text-align: center;
        }
    </style>
</head>
<body>

    <div id="tooltip"></div>
    <div id="globe-container">
        <svg id="globe"></svg>
    </div>

    <script>
        // --- 📊 全世界の主要空港データ ---
        const airportData = [
            // 🇯🇵 日本
            { name: "東京国際空港（羽田）", iata: "HND", country: "JP", lat: 35.549, lon: 139.780, tc: "TC3" },
            { name: "成田国際空港", iata: "NRT", country: "JP", lat: 35.772, lon: 140.393, tc: "TC3" },
            { name: "関西国際空港", iata: "KIX", country: "JP", lat: 34.432, lon: 135.230, tc: "TC3" },
            { name: "大阪国際空港（伊丹）", iata: "ITM", country: "JP", lat: 34.785, lon: 135.438, tc: "TC3" },
            { name: "中部国際空港", iata: "NGO", country: "JP", lat: 34.858, lon: 136.805, tc: "TC3" },
            { name: "新千歳空港", iata: "CTS", country: "JP", lat: 42.775, lon: 141.692, tc: "TC3" },
            { name: "福岡空港", iata: "FUK", country: "JP", lat: 33.585, lon: 130.450, tc: "TC3" },
            { name: "那覇空港", iata: "OKA", country: "JP", lat: 26.195, lon: 127.646, tc: "TC3" },

            // 🇰🇷 韓国・ 🇹🇼 台湾・ 🇨🇳 中国・香港
            { name: "仁川国際空港", iata: "ICN", country: "KR", lat: 37.460, lon: 126.440, tc: "TC3" },
            { name: "台湾桃園国際空港", iata: "TPE", country: "TW", lat: 25.079, lon: 121.234, tc: "TC3" },
            { name: "北京首都国際空港", iata: "PEK", country: "CN", lat: 40.079, lon: 116.603, tc: "TC3" },
            { name: "上海浦東国際空港", iata: "PVG", country: "CN", lat: 31.144, lon: 121.808, tc: "TC3" },
            { name: "香港国際空港", iata: "HKG", country: "HK", lat: 22.308, lon: 113.914, tc: "TC3" },

            // 🇸GP 🇹🇭 🇲🇾 🇮🇩 東南アジア・オセアニア (TC3)
            { name: "シンガポール・チャンギ空港", iata: "SIN", country: "SG", lat: 1.350, lon: 103.994, tc: "TC3" },
            { name: "スワンナプーム国際空港", iata: "BKK", country: "TH", lat: 13.690, lon: 100.750, tc: "TC3" },
            { name: "クアラルンプール国際空港", iata: "KUL", country: "MY", lat: 2.745, lon: 101.709, tc: "TC3" },
            { name: "スカルノ・ハッタ国際空港", iata: "CGK", country: "ID", lat: -6.125, lon: 106.655, tc: "TC3" },
            { name: "シドニー国際空港", iata: "SYD", country: "AU", lat: -33.946, lon: 151.177, tc: "TC3" },
            { name: "オークランド空港", iata: "AKL", country: "NZ", lat: -37.008, lon: 174.791, tc: "TC3" },

            // 🇺🇸 🇨🇦 🇧🇷 🇦🇷 北米・南米 (TC1)
            { name: "ジョン・F・ケネディ国際空港", iata: "JFK", country: "US", lat: 40.640, lon: -73.779, tc: "TC1" },
            { name: "ロサンゼルス国際空港", iata: "LAX", country: "US", lat: 33.942, lon: -118.408, tc: "TC1" },
            { name: "シカゴ・オヘア国際空港", iata: "ORD", country: "US", lat: 41.974, lon: -87.907, tc: "TC1" },
            { name: "トロント・ピアソン国際空港", iata: "YYZ", country: "CA", lat: 43.677, lon: -79.624, tc: "TC1" },
            { name: "メキシコシティ国際空港", iata: "MEX", country: "MX", lat: 19.436, lon: -99.072, tc: "TC1" },
            { name: "グアルーリョス国際空港", iata: "GRU", country: "BR", lat: -23.435, lon: -46.473, tc: "TC1" },
            { name: "ミニストロ・ピスタリーニ国際空港", iata: "EZE", country: "AR", lat: -34.822, lon: -58.535, tc: "TC1" },

            // 🇬🇧 FR 🇩🇪 🇹🇷 🇦🇪 🇿🇦 欧州・中東・アフリカ (TC2)
            { name: "ロンドン・ヒースロー空港", iata: "LHR", country: "GB", lat: 51.470, lon: -0.454, tc: "TC2" },
            { name: "パリ＝シャルル・ド・ゴール空港", iata: "CDG", country: "FR", lat: 49.010, lon: 2.550, tc: "TC2" },
            { name: "フランクフルト空港", iata: "FRA", country: "DE", lat: 50.033, lon: 8.570, tc: "TC2" },
            { name: "ローマ・フィウミチーノ空港", iata: "FCO", country: "IT", lat: 41.800, lon: 12.239, tc: "TC2" },
            { name: "イスタンブール空港", iata: "IST", country: "TR", lat: 41.275, lon: 28.751, tc: "TC2" },
            { name: "ドバイ国際空港", iata: "DXB", country: "AE", lat: 25.253, lon: 55.364, tc: "TC2" },
            { name: "オリバー・タンボ国際空港", iata: "JNB", country: "ZA", lat: -26.139, lon: 28.246, tc: "TC2" }
        ];

        // TopoJSONの数値IDから、2文字コード＆航空業界TC区分(TC1, TC2, TC3)へのマッピング
        const idToCountryConfig = {
            "392": { iso2: "JP", tc: "TC3" }, // 日本
            "410": { iso2: "KR", tc: "TC3" }, // 韓国
            "158": { iso2: "TW", tc: "TC3" }, // 台湾
            "156": { iso2: "CN", tc: "TC3" }, // 中国
            "344": { iso2: "HK", tc: "TC3" }, // 香港
            "702": { iso2: "SG", tc: "TC3" }, // シンガポール
            "764": { iso2: "TH", tc: "TC3" }, // タイ
            "458": { iso2: "MY", tc: "TC3" }, // マレーシア
            "360": { iso2: "ID", tc: "TC3" }, // インドネシア
            "608": { iso2: "PH", tc: "TC3" }, // フィリピン
            "704": { iso2: "VN", tc: "TC3" }, // ベトナム
            "036": { iso2: "AU", tc: "TC3" }, // オーストラリア
            "554": { iso2: "NZ", tc: "TC3" }, // ニュージーランド
            "840": { iso2: "US", tc: "TC1" }, // アメリカ
            "124": { iso2: "CA", tc: "TC1" }, // カナダ
            "484": { iso2: "MX", tc: "TC1" }, // メキシコ
            "076": { iso2: "BR", tc: "TC1" }, // ブラジル
            "032": { iso2: "AR", tc: "TC1" }, // アルゼンチン
            "826": { iso2: "GB", tc: "TC2" }, // イギリス
            "250": { iso2: "FR", tc: "TC2" }, // フランス
            "276": { iso2: "DE", tc: "TC2" }, // ドイツ
            "380": { iso2: "IT", tc: "TC2" }, // イタリア
            "792": { iso2: "TR", tc: "TC2" }, // トルコ
            "784": { iso2: "AE", tc: "TC2" }, // UAE
            "634": { iso2: "QA", tc: "TC2" }, // カタール
            "710": { iso2: "ZA", tc: "TC2" }  // 南アフリカ
        };

        // 🎨 TC区分ごとのシステマチックなカラー定義
        const tcColors = {
            "TC1": "#2a1e3d", // 紫系（南北アメリカ）
            "TC2": "#3d1e22", // 赤系（欧州・中東・アフリカ）
            "TC3": "#1e3d2a", // 緑系（アジア・オセアニア）
            "unknown": "#263238" // 設定外の国（ダークグレー）
        };

        const width = window.innerWidth;
        const height = window.innerHeight;
        const sensitivity = 0.12; // 🔄 滑らかにドラッグ回転する心地よい超低感度

        const svg = d3.select("#globe")
            .attr("width", width)
            .attr("height", height);

        // 3D地球儀の初期設定
        const projection = d3.geoOrthographic()
            .scale(280)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        // 🌊 海の描写（完全に不透明な深海ネイビーで視認性を確保）
        const ocean = svg.append("circle")
            .attr("cx", width / 2)
            .attr("cy", height / 2)
            .attr("r", projection.scale())
            .style("fill", "#050e1e")
            .style("stroke", "none");

        const mapGroup = svg.append("g");  
        const pinsGroup = svg.append("g"); 

        let currentActiveCountry = ""; // 現在ホバーされている国のコード

        // 🗺️ 世界標準データ（TopoJSON）をロード
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
            .then(function(world) {
                const countries = topojson.feature(world, world.objects.countries).features;

                // 陸地の描写
                mapGroup.selectAll(".country")
                    .data(countries)
                    .enter().append("path")
                    .attr("class", "country")
                    .attr("d", path)
                    // 🔍 業界指定の「TC1 / TC2 / TC3」の所属に合わせて自動色分け塗りつぶし！
                    .style("fill", d => {
                        const config = idToCountryConfig[String(d.id)];
                        return config ? tcColors[config.tc] : tcColors["unknown"];
                    })
                    .style("stroke", "#111a24")
                    .style("stroke-width", "0.8px")
                    
                    // 🔎 マウスホバーイベント
                    .on("mouseover", function(event, d) {
                        const name = d.properties.name || "不明な国";
                        const countryId = String(d.id);
                        const config = idToCountryConfig[countryId];
                        const iso2 = config ? config.iso2 : "";
                        const tcName = config ? config.tc : "未定義エリア";

                        currentActiveCountry = iso2;

                        // ① 国名とIATA管轄エリア(TC)を中央上部にスマート表示
                        d3.select("#tooltip")
                            .html(`🌍 ${name} ${iso2 ? '(' + iso2 + ')' : ''} [${tcName}]`)
                            .style("display", "block");

                        // ② マウスが乗った国だけを鮮烈なネオンブルーに発光ライトアップ！
                        d3.select(this).style("fill", "#00aaff");

                        // ③ 文字ラベルの表示状態を瞬時に切り替え
                        refreshLabels();
                    })
                    
                    .on("mouseout", function(event, d) {
                        currentActiveCountry = "";
                        d3.select("#tooltip").style("display", "none");
                        
                        // マウスが離れたら、TC1〜3の元の所属色に自動で復元
                        const config = idToCountryConfig[String(d.id)];
                        d3.select(this).style("fill", config ? tcColors[config.tc] : tcColors["unknown"]);
                        
                        refreshLabels();
                    });

                // 📌 最初からすべての空港ピンを地球上にプロット
                initAllPins();

                // 🔄 地球儀を手動でドラッグして回す処理
                svg.call(d3.drag().on("drag", function(event) {
                    const rotate = projection.rotate();
                    projection.rotate([
                        rotate[0] + event.dx * sensitivity,
                        rotate[1] - event.dy * sensitivity
                    ]);
                    refreshAll();
                }));

                // 🖱️ 【ズーム大幅強化】スクロールによる拡大縮小の上限をこれまでの2倍（4.0）まで拡張！
                svg.call(d3.zoom()
                    .scaleExtent([0.5, 8.0]) // 🛑 縮小0.5倍〜最大8倍まで超絶ズームアップ可能に
                    .on("zoom", function(event) {
                        projection.scale(280 * event.transform.k);
                        refreshAll();
                    })
                );
            });

        // 画面全体の再描画関数
        function refreshAll() {
            svg.selectAll(".country").attr("d", path);
            ocean.attr("r", projection.scale());
            updatePinsAndLabels();
        }

        // --- 📌 空港ピンとラベル（テキスト）の初期配置 ---
        function initAllPins() {
            airportData.forEach(ap => {
                const geoPoint = { "type": "Point", "coordinates": [ap.lon, ap.lat] };
                
                // 🔴 空港ピン（常時表示される小さなサークルマーカー）
                pinsGroup.append("circle")
                    .datum(geoPoint)
                    .attr("class", "airport-pin")
                    .attr("r", 4.2)
                    .style("fill", "#ff3300")
                    .style("stroke", "#ffffff")
                    .style("stroke-width", "1.2px");

                // 🔤 空港名テキスト（普段は非表示、該当国ホバー時のみ出現）
                pinsGroup.append("text")
                    .datum({ geo: geoPoint, country: ap.country, text: `✈️ ${ap.name} [${ap.iata}]` })
                    .attr("class", "airport-text")
                    .text(d => d.text)
                    .attr("dx", 10)
                    .attr("dy", 4)
                    .style("fill", "#ffcc00")
                    .style("font-size", "12px")
                    .style("font-weight", "bold")
                    .style("text-shadow", "2px 2px 3px #000")
                    .style("display", "none"); 
            });

            updatePinsAndLabels();
        }

        // 文字ラベルの「表示・非表示」のリアルタイム切り替え
        function refreshLabels() {
            pinsGroup.selectAll(".airport-text")
                .style("display", function(d) {
                    const gpath = d3.geoPath().projection(projection);
                    // 地球の表側にあり、かつ「現在ホバーされている国コード」と一致する場合のみ表示
                    if (gpath(d.geo) && d.country === currentActiveCountry) {
                        return "inline";
                    }
                    return "none";
                });
        }

        // 回転やズームに合わせて、全てのピンと文字の位置・裏表の視認性を再計算する関数
        function updatePinsAndLabels() {
            // ピンの位置修正
            pinsGroup.selectAll(".airport-pin")
                .attr("cx", d => projection(d.coordinates)[0])
                .attr("cy", d => projection(d.coordinates)[1])
                .style("display", d => {
                    const gpath = d3.geoPath().projection(projection);
                    return gpath(d) ? "inline" : "none"; // 裏側は非表示
                });

            // 空港名テキストの位置修正
            pinsGroup.selectAll(".airport-text")
                .attr("x", d => projection(d.geo.coordinates)[0])
                .attr("y", d => projection(d.geo.coordinates)[1])
                .style("display", function(d) {
                    const gpath = d3.geoPath().projection(projection);
                    if (gpath(d.geo) && d.country === currentActiveCountry) {
                        return "inline";
                    }
                    return "none";
                });
        }

        // ウィンドウズサイズが変更されたときの自動追従
        window.addEventListener("resize", function() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            svg.attr("width", w).attr("height", h);
            projection.translate([w / 2, h / 2]);
            ocean.attr("cx", w / 2).attr("cy", h / 2);
            refreshAll();
        });

    </script>
</body>
</html>
