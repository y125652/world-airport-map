        // 2D判定用カラーキャンバス（メモリ上）
        const pickCanvas = document.createElement('canvas');
        pickCanvas.width = 4096;
        pickCanvas.height = 2048;
        const pCtx = pickCanvas.getContext('2d', { willReadFrequently: true });

        const colorToCountryMap = {};

        // ★海の透明度を絶妙に調整（不透明度を 20% から 65% に引き上げ）
        // これにより、向こう側の線が「程よく曇って隠れる」ため、手前の大陸がめちゃくちゃ見やすくなります！
        const globeGeometry = new THREE.SphereGeometry(RADIUS, 64, 64);
        const globeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x0c1432,       // 宇宙に溶け込む深みのあるディープブルー
            transparent: true, 
            opacity: 0.65,         // ★ここを0.65（65%）にして「スモークガラス感」を出しました
            side: THREE.DoubleSide, 
            depthWrite: false 
        });
        const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
        globeMesh.userData = { type: 'globe' };
        globeMesh.renderOrder = 0;
        globeGroup.add(globeMesh);

        function lngLatToCanvas(lng, lat) {
            const x = ((lng + 180) / 360) * pickCanvas.width;
            const y = ((90 - lat) / 180) * pickCanvas.height;
            return { x, y };
        }

        const normalLineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
        const highlightLineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.0 });
        
        const allCountryLines = []; 
        let lastHoveredCountryName = null;

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (-lng - 90) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);
            return new THREE.Vector3(x, y, z);
        }

        function normalizeLngDiff(diff) {
            while (diff > 180) diff -= 360;
            while (diff < -180) diff += 360;
            return diff;
        }

        function subdivideRing(ring) {
            const newRing = [];
            const maxSegmentLength = 1.5;
            for (let i = 0; i < ring.length - 1; i++) {
                const p1 = ring[i];
                const p2 = ring[i+1];
                newRing.push(p1);
                const lngDiff = normalizeLngDiff(p2[0] - p1[0]);
                const latDiff = p2[1] - p1[1];
                const distance = Math.sqrt(lngDiff * lngDiff + latDiff * latDiff);
                if (distance > maxSegmentLength) {
                    const steps = Math.ceil(distance / maxSegmentLength);
                    for (let s = 1; s < steps; s++) {
                        const t = s / steps;
                        newRing.push([p1[0] + lngDiff * t, p1[1] + latDiff * t]);
                    }
                }
            }
            newRing.push(ring[ring.length - 1]);
            return newRing;
        }

        // GeoJSON取得と2Dマップの自動色分けビルド
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(geoJson => {
                pCtx.clearRect(0, 0, pickCanvas.width, pickCanvas.height);

                geoJson.features.forEach((feature, index) => {
                    const type = feature.geometry.type;
                    const coordinates = feature.geometry.coordinates;
                    let countryName = feature.properties.NAME_JA || feature.properties.NAME || "不明な国";
                    if(countryName.includes("Antarctica")) countryName = "南極";

                    const r = (index + 1) & 0xff;
                    const g = ((index + 1) >> 8) & 0xff;
                    const b = ((index + 1) >> 16) & 0xff;
                    const colorKey = `rgb(${r},${g},${b})`;
                    
                    colorToCountryMap[colorKey] = countryName;

                    pCtx.fillStyle = colorKey;

                    if (type === 'Polygon') {
                        drawCanvasPolygon(coordinates);
                        processLinePolygon(coordinates, countryName);
                    } else if (type === 'MultiPolygon') {
                        coordinates.forEach(polygon => {
                            drawCanvasPolygon(polygon);
                            processLinePolygon(polygon, countryName);
                        });
                    }
                });
            });

        function drawCanvasPolygon(polygon) {
            pCtx.beginPath();
            const outerRing = polygon[0];
            let pStart = lngLatToCanvas(outerRing[0][0], outerRing[0][1]);
            pCtx.moveTo(pStart.x, pStart.y);
            for (let i = 1; i < outerRing.length; i++) {
                let p = lngLatToCanvas(outerRing[i][0], outerRing[i][1]);
                pCtx.lineTo(p.x, p.y);
            }
            pCtx.closePath();
            pCtx.fill();

            if (polygon.length > 1) {
                pCtx.globalCompositeOperation = 'destination-out';
                for (let i = 1; i < polygon.length; i++) {
                    pCtx.beginPath();
                    const holeRing = polygon[i];
                    let pSubStart = lngLatToCanvas(holeRing[0][0], holeRing[0][1]);
                    pCtx.moveTo(pSubStart.x, pSubStart.y);
                    for (let j = 1; j < holeRing.length; j++) {
                        let pSub = lngLatToCanvas(holeRing[j][0], holeRing[j][1]);
                        pCtx.lineTo(pSub.x, pSub.y);
                    }
                    pCtx.closePath();
                    pCtx.fill();
                }
                pCtx.globalCompositeOperation = 'source-over';
            }
        }

        function processLinePolygon(polygon, countryName) {
            const subdividedPolygon = polygon.map(ring => subdivideRing(ring));
            const ring = subdividedPolygon[0];

            let currentSegment = [];
            for (let i = 0; i < ring.length; i++) {
                currentSegment.push(ring[i]);
                if (i < ring.length - 1) {
                    if (Math.abs(normalizeLngDiff(ring[i][0] - ring[i+1][0])) > 170) {
                        createCountryLines(currentSegment, countryName);
                        currentSegment = [];
                    }
                }
            }
            if (currentSegment.length > 0) { createCountryLines(currentSegment, countryName); }
        }

        function createCountryLines(pointsData, name) {
            const points = pointsData.map(coord => latLngToVector3(coord[1], coord[0], RADIUS + 0.1));
            if (points.length < 2) return;
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            
            const normalLine = new THREE.Line(lineGeometry, normalLineMaterial);
            normalLine.renderOrder = 1;
            globeGroup.add(normalLine);

            const highMat = highlightLineMaterial.clone();
            const highlightLine = new THREE.Line(lineGeometry, highMat);
            highlightLine.renderOrder = 2;
            highlightLine.userData = { name: name };
            globeGroup.add(highlightLine);

            allCountryLines.push(highlightLine);
        }

        // 貨物空港ピン（サイズ0.45）
        const pins = [];
        const pinGeometry = new THREE.SphereGeometry(0.45, 16, 16);
        const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xff2d55 });

        cargoAirports.forEach(airport => {
            const pin = new THREE.Mesh(pinGeometry, pinMaterial);
            const pos = latLngToVector3(airport.lat, airport.lng, RADIUS + 0.25);
            pin.position.copy(pos);
            pin.userData = { type: 'airport', name: airport.name, country: airport.country };
            pin.renderOrder = 3; 
            globeGroup.add(pin);
            pins.push(pin);
        });

        // インタラクション設定
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const airportIntersects = raycaster.intersectObjects(pins);
            let isHoveringAirport = false;

            if (airportIntersects.length > 0) {
                const data = airportIntersects[0].object.userData;
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${data.name}</strong><br><small>国: ${data.country}</small>`;
                document.body.style.cursor = 'pointer';
                isHoveringAirport = true;
            } else {
                labelEl.style.display = 'none';
                document.body.style.cursor = 'default';
            }

            let currentHoveredCountryName = null;
            const globeIntersects = raycaster.intersectObject(globeMesh);

            if (globeIntersects.length > 0 && !isHoveringAirport) {
                const hit = globeIntersects[0];
                if (hit.uv) {
                    const x = Math.floor(hit.uv.x * pickCanvas.width);
                    const y = Math.floor((1.0 - hit.uv.y) * pickCanvas.height);

                    const pixel = pCtx.getImageData(x, y, 1, 1).data;
                    
                    if (pixel[3] > 0) {
                        const colorKey = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
                        currentHoveredCountryName = colorToCountryMap[colorKey] || null;
                    }
                }
            }

            if (currentHoveredCountryName !== lastHoveredCountryName) {
                allCountryLines.forEach(line => {
                    if (line.userData.name === lastHoveredCountryName) {
                        line.material.opacity = 0.0; 
                    }
                    if (line.userData.name === currentHoveredCountryName) {
                        line.material.opacity = 0.95; 
                    }
                });
                lastHoveredCountryName = currentHoveredCountryName;
            }

            if (currentHoveredCountryName && !isHoveringAirport) {
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${currentHoveredCountryName}</strong>`;
            }

            if (!isDragging) return;
            const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
            globeGroup.rotation.y += deltaMove.x * 0.004;
            globeGroup.rotation.x += deltaMove.y * 0.004;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        
        window.addEventListener('wheel', (e) => {
            currentZoom += e.deltaY * 0.1;
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
            camera.position.z = currentZoom;
        }, { passive: true });

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
