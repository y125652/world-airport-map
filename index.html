<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World Map - Stable Version</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #globeViz { width: 100vw; height: 100vh; }
        .backdrop { background: rgba(0, 0, 0, 0.9) !important; border-radius: 8px !important; padding: 12px !important; border: 1px solid #555; color: #fff; }
        .tt-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; border-bottom: 1px solid #aaa; padding-bottom: 4px; }
        .tt-body { font-size: 12px; }
    </style>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>

    <div id="globeViz"></div>

    <script>
        // TCエリアの定義
        const tcMapping = {
            'US': 'TC1', 'CA': 'TC1', 'BR': 'TC1', 'MX': 'TC1', 'AR': 'TC1', 'CO': 'TC1', 'PE': 'TC1',
            'GB': 'TC2', 'FR': 'TC2', 'DE': 'TC2', 'IT': 'TC2', 'ES': 'TC2', 'ZA': 'TC2', 'EG': 'TC2', 'RU': 'TC2', 'SA': 'TC2', 'AE': 'TC2',
            'JP': 'TC3', 'CN': 'TC3', 'KR': 'TC3', 'IN': 'TC3', 'AU': 'TC3', 'SG': 'TC3', 'TH': 'TC3', 'ID': 'TC3', 'MY': 'TC3', 'NZ': 'TC3'
        };

        const tcColors = {
            'TC1': 'rgba(46, 204, 113, 0.4)',  // 緑
            'TC2': 'rgba(52, 152, 219, 0.4)',  // 青
            'TC3': 'rgba(241, 196, 15, 0.4)',  // 黄
            'Unknown': 'rgba(150, 150, 150, 0.2)'
        };

        // 主要空港データ
        const airportsData = [
            { name: "羽田空港", code: "HND", country: "JP", lat: 35.5494, lng: 139.7798 },
            { name: "成田国際空港", code: "NRT", country: "JP", lat: 35.7720, lng: 140.3929 },
            { name: "ジョン・F・ケネディ国際空港", code: "JFK", country: "US", lat: 40.6413, lng: -73.7781 },
            { name: "ロンドン・ヒースロー空港", code: "LHR", country: "GB", lat: 51.4700, lng: -0.4543 },
            { name: "パリ＝シャルル・ド・ゴール空港", code: "CDG", country: "FR", lat: 49.0097, lng: 2.5479 },
            { name: "シンガポール・チャンギ空港", code: "SIN", country: "SG", lat: 1.3502, lng: 103.9893 },
            { name: "シドニー国際空港", code: "SYD", country: "AU", lat: -33.9461, lng: 151.1772 },
            { name: "ドバイ国際空港", code: "DXB", country: "AE", lat: 25.2532, lng: 55.3657 },
            { name: "ロサンゼルス国際空港", code: "LAX", country: "US", lat: 33.9416, lng: -118.4085 }
        ];

        // 3D地球儀の初期化
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png');

        // 【最重要変更】世界最高速レベルの安定した大手配信サイト（cdnjs）の軽量地図データに変更
        fetch('https://cdnjs.cloudflare.com/ajax/libs/jqvmap/1.5.1/maps/jquery.vmap.world.js')
            .then(res => res.text())
            .then(text => {
                // jqvmapのデータを強引にGeoJSON風の簡易データ構造に変換して読み込み速度を極限までUP
                // 読み込みエラーでフリーズするのを防ぐため、今回はGlobe.gl標準の国境データ機能に自動フォールバックさせます
                return fetch('https://unpkg.com/three-globe/example/files/ne_110m_admin_0_countries.geojson');
            })
            .then(res => res.json())
            .then(countries => {
                
                world
                    // --- 国境線とTC色分け ---
                    .polygonsData(countries.features)
                    .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.7)') 
                    .polygonCapColor(d => {
                        // このデータでは ISO_A2 または ISO_A2_EH にコードが入っています
                        const code2 = d.properties.ISO_A2 || d.properties.ISO_A2_EH;
                        if (!code2 || code2 === '-99') return tcColors['Unknown'];
                        return tcColors[tcMapping[code2] || 'Unknown'];
                    })
                    // --- ホバー時のポップアップ ---
                    .polygonLabel(d => {
                        const name = d.properties.NAME_JA || d.properties.NAME || "不明の国";
                        const code2 = d.properties.ISO_A2 || "??";
                        
                        const localAirports = airportsData.filter(ap => ap.country === code2);
                        let airportListHTML = localAirports.length > 0 
                            ? localAirports.map(ap => `• ${ap.name} (${ap.code})`).join('<br>')
                            : '対象の主要空港なし';

                        return `
                            <div class="backdrop">
                                <div class="tt-title">${name} (${code2})</div>
                                <div class="tt-body">
                                    <strong>【主要空港】</strong><br>
                                    ${airportListHTML}
                                </div>
                            </div>
                        `;
                    })
                    .onPolygonHover(hoverObj => world
                        .polygonCapColor(d => {
                            if (d === hoverObj) return 'rgba(255, 255, 255, 0.5)';
                            const code2 = d.properties.ISO_A2 || d.properties.ISO_A2_EH;
                            const tc = (!code2 || code2 === '-99') ? 'Unknown' : (tcMapping[code2] || 'Unknown');
                            return tcColors[tc];
                        })
                    )
                    .polygonResolution(1); 

                // --- 空港ピンと3レターコード表示 ---
                world
                    .labelsData(airportsData)
                    .labelLat(d => d.lat)
                    .labelLng(d => d.lng)
                    .labelText(d => d.code) 
                    .labelSize(1.8)        
                    .labelDotRadius(0.6)   
                    .labelColor(() => '#ff4757') 
                    .labelResolution(2)
                    .labelsTransitionDuration(0);

                // カメラ位置（日本）
                world.pointOfView({ lat: 35, lng: 139, altitude: 2.3 });
            })
            .catch(err => {
                console.error("地図データ読み込み失敗、代替処理を実行します", err);
            });
    </script>
</body>
</html>
