<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe - Perfect Face Hover (Canvas Texture)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .info-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            display: none;
            z-index: 10;
            transform: translate(15px, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>

    <div id="info-label" class="info-label"></div>
    <div id="canvas-container"></div>

    <script>

        const MAX_ZOOM = 300;
        camera.position.z = currentZoom;

        renderer.setClearColor(0xffffff, 1);
        container.appendChild(renderer.domElement);

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        // 貨物空港データ
        const cargoAirports = [

            { name: "クアラルンプール国際空港 (KUL)", country: "マレーシア", lat: 2.7456, lng: 101.7072 },

            { name: "ジョン・F・ケネディ国際空港 (JFK)", country: "アメリカ", lat: 40.6413, lng: -73.7781 },
            { name: "シカゴ・オヘア国際空港 (ORD)", country: "アメリカ", lat: 41.9742, lng: -87.9073 },
            { name: "マイアミ国際空港 (MIA)", country: "アメリカ", lat: 25.7959, lng: -80.2870 },
            { name: "ダラス・フォートワース国際空港 (DFW)", country: "アメリカ", lat: 32.8998, lng: -97.0403 },
            { name: "ハーツフィールド・ジャクソン・アトランタ国際空港 (ATL)", country: "アメリカ", lat: 33.6407, lng: -84.4277 },
            { name: "トロント・ピアソン国際空港 (YYZ)", country: "カナダ", lat: 43.6777, lng: -79.6248 },
            { name: "バンクーバー国際空港 (YVR)", country: "カナダ", lat: 49.1967, lng: -123.1815 },

            { name: "ミラノ・マルペンサ空港 (MXP)", country: "イタリア", lat: 45.6300, lng: 8.7231 },
            { name: "マドリード・バラハス空港 (MAD)", country: "スペイン", lat: 40.4839, lng: -3.5679 },
            { name: "ザベンテム空港 (BRU)", country: "ベルギー", lat: 50.9014, lng: 4.4844 },
            { name: "ルクセンブルク・フィンデル空港 (LUX)", country: "ルクセンブルク", lat: 49.6233, lng: 6.2044 },
            { name: "チューリッヒ空港 (ZRH)", country: "スイス", lat: 47.4582, lng: 8.5481 },
            { name: "イスタンブール空港 (IST)", country: "トルコ", lat: 41.2753, lng: 28.7519 },
            { name: "ドバイ国際空港 (DXB)", country: "アラブ首長国連邦", lat: 25.2532, lng: 55.3657 },
            { name: "アール・マクトゥーム国際空港 (DWC)", country: "アラブ首長国連邦", lat: 24.8961, lng: 55.1614 },
            { name: "カタール・ハマド国際空港 (DOH)", country: "カタール", lat: 25.2611, lng: 51.5651 },
            { name: "キング・ファハド国際空港 (DMM)", country: "サウジアラビア", lat: 26.4712, lng: 49.7979 },
            { name: "ベングリオン国際空港 (TLV)", country: "イスラエル", lat: 32.0056, lng: 34.8854 },
            { name: "カイロ国際空港 (CAI)", country: "エジプト", lat: 30.1219, lng: 31.4056 },
            { name: "ジョモ・ケニヤッタ国際空港 (NBO)", country: "ケニア", lat: -1.3192, lng: 36.9275 },
            { name: "O・R・タンボ国際空港 (JNB)", country: "南アフリカ", lat: -26.1367, lng: 28.2460 },
            { name: "ムルタラ・モハンマド国際空港 (LOS)", country: "ナイジェリア", lat: 6.5774, lng: 3.3210 },
            { name: "ボレ国際空港 (ADD)", country: "エチオピア", lat: 8.9779, lng: 38.7993 },
            { name: "グアルーリョス国際空港 (GRU)", country: "ブラジル", lat: -23.4356, lng: -46.4731 },
            { name: "ヴィラコッポス国際空港 (VCP)", country: "ブラジル", lat: -23.0074, lng: -47.1344 },
            { name: "ミニストロ・ピスタリーニ国際空港 (EZE)", country: "アルゼンチン", lat: -34.8222, lng: -58.5358 },
            { name: "エルドラド国際空港 (BOG)", country: "コロンビア", lat: 4.7017, lng: -74.1469 },
            { name: "アルトゥーロ・メリノ・ベニテス国際空港 (SCL)", country: "チリ", lat: -33.3930, lng: -70.7858 },
            { name: "ホル Jorge・チャベス国際空港 (LIM)", country: "ペルー", lat: -12.0219, lng: -77.1143 },
            { name: "トクメン国際空港 (PTY)", country: "パナマ", lat: 9.0714, lng: -79.3835 },
            { name: "フアン・サンタマリア国際空港 (SJO)", country: "コスタリカ", lat: 9.9939, lng: -84.2089 },
            { name: "ララ・エレーラ国際空港 (UIO)", country: "エクアドル", lat: -0.1228, lng: -78.3575 }
        ];

        // 緯度経度を3D空間のVector3座標に変換する関数
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (-lng + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);
            return new THREE.Vector3(x, y, z);
        }

        // --- メモリ上のHTML5 Canvasで地図テクスチャを作成 ---
        const canvas = document.createElement('canvas');
        canvas.width = 2048;  // 球体に貼るため高解像度（2K）に設定
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        // Canvasをテクスチャとして読み込み、球体メッシュを生成
        const texture = new THREE.CanvasTexture(canvas);
        const sphereGeometry = new THREE.SphereGeometry(RADIUS, 64, 64);
        const sphereMaterial = new THREE.MeshBasicMaterial({ map: texture });
        const globeMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
        globeGroup.add(globeMesh);

        // カラーパレット設定
        const COLOR_SEA = "#1a237e";       // 海: ディープネイビー
        const COLOR_LAND = "#ffffff";      // 通常の陸地: 白
        const COLOR_BORDER = "#d1d5db";    // 国境線: 綺麗なライトグレー
        const COLOR_HIGHLIGHT = "#00e6ff"; // ホバーした面: 鮮やかなネオンブルー

        let geoJsonData = null;
        let hoveredCountryIndex = null; // 現在ホバーされている国の配列インデックス

        // 経度緯度を2Dキャンバス上のXYピクセル座標にマッピングする
        function geoToCanvas(lng, lat) {
            const x = ((lng + 180) / 360) * canvas.width;
            const y = ((90 - lat) / 180) * canvas.height;
            return { x, y };
        }

        // 地図を更新・再描画するメイン処理
        function drawMap() {
            if (!geoJsonData) return;

            // 1. 海の背景をクリア塗りつぶし
            ctx.fillStyle = COLOR_SEA;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. すべての国の「面」と「国境線」をCanvas上に一括で描画
            geoJsonData.features.forEach((feature, index) => {
                const isHovered = (index === hoveredCountryIndex);
                
                // ホバー中ならネオンブルー、通常なら白
                ctx.fillStyle = isHovered ? COLOR_HIGHLIGHT : COLOR_LAND;
                ctx.strokeStyle = COLOR_BORDER;
                ctx.lineWidth = 1.2;

                const type = feature.geometry.type;
                const coordinates = feature.geometry.coordinates;

                if (type === 'Polygon') {
                    drawPolygon(coordinates);
                } else if (type === 'MultiPolygon') {
                    coordinates.forEach(polygon => drawPolygon(polygon));
                }
            });

            // Three.js 側にCanvas画像が書き換わったことを通知し、画面に反映
            texture.needsUpdate = true;
        }

        // 多角形（穴あき対応）を描画する補助関数
        function drawPolygon(polygon) {
            ctx.beginPath();
            polygon.forEach((ring) => {
                ring.forEach((coord, i) => {
                    const pos = geoToCanvas(coord[0], coord[1]);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
            });
            ctx.fill();
            ctx.stroke();
        }

        // GeoJSONデータの取得
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(geoJson => {
                geoJsonData = geoJson;
                drawMap(); // データ取得完了後に初回描画
            });

        // 貨物空港ピン（赤色の3D球体）の生成
        const pins = [];
        const pinGeometry = new THREE.SphereGeometry(1.0, 16, 16);
        const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xff3366 });

        cargoAirports.forEach(airport => {
            const pin = new THREE.Mesh(pinGeometry, pinMaterial);
            // 球体の表面から少し浮くように配置 (RADIUS + 0.4)
            const pos = latLngToVector3(airport.lat, airport.lng, RADIUS + 0.4);
            pin.position.copy(pos);
            pin.userData = { type: 'airport', name: airport.name, country: airport.country };
            globeGroup.add(pin);
            pins.push(pin);
        });

        // アジア方面が見えるように地球の初期角度を少し回す
        globeGroup.rotation.y = 2.5;

        // マウスインタラクション変数
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            // マウスのスクリーン座標をThree.jsの標準化座標（-1 ～ +1）に変換
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            // 1. まず空港ピンのホバーを優先判定
            const airportIntersects = raycaster.intersectObjects(pins);
            
            if (airportIntersects.length > 0) {
                const data = airportIntersects[0].object.userData;
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${data.name}</strong><br><small>国: ${data.country}</small>`;
                document.body.style.cursor = 'pointer';
                
                // 空港に乗っている時は国のハイライトを解除
                if (hoveredCountryIndex !== null) {
                    hoveredCountryIndex = null;
                    drawMap();
                }
            } else {
                // 2. 空港に乗っていなければ、地球儀（球体メッシュ）のホバーを判定
                const globeIntersects = raycaster.intersectObject(globeMesh);
                
                if (globeIntersects.length > 0 && geoJsonData) {
                    // 交点部分の「UV座標（テクスチャ上の 0.0〜1.0 の位置）」を取得
                    const uv = globeIntersects[0].uv;
                    
                    // UV座標を「経度（lng）」と「緯度（lat）」の数値に正確に復元計算
                    const lng = uv.x * 360 - 180;
                    const lat = uv.y * 180 - 90;

                    // マウスが指している経度緯度がいずれかの国のポリゴン（面）の内部にあるかを探索
                    let foundIndex = null;
                    for (let i = 0; i < geoJsonData.features.length; i++) {
                        if (isPointInFeature(lng, lat, geoJsonData.features[i])) {
                            foundIndex = i;
                            break;
                        }
                    }

                    if (foundIndex !== null) {
                        // 国が見つかった場合、ラベルを表示してテクスチャを再描画（ハイライト）
                        const feature = geoJsonData.features[foundIndex];
                        const countryName = feature.properties.NAME_JA || feature.properties.NAME || "Unknown";
                        const isoA2 = feature.properties.ISO_A2 || feature.properties.iso_a2 || "??";

                        labelEl.style.display = 'block';
                        labelEl.style.left = `${e.clientX}px`;
                        labelEl.style.top = `${e.clientY}px`;
                        labelEl.innerHTML = `<strong>${countryName}</strong> (${isoA2})`;
                        document.body.style.cursor = 'default';

                        // 前回とホバーした国が変わった場合のみ、Canvasの再描画を走らせる（軽量化）
                        if (hoveredCountryIndex !== foundIndex) {
                            hoveredCountryIndex = foundIndex;
                            drawMap();
                        }
                    } else {
                        // 海の上にマウスがある場合、ハイライトをリセット
                        labelEl.style.display = 'none';
                        document.body.style.cursor = 'default';
                        if (hoveredCountryIndex !== null) {
                            hoveredCountryIndex = null;
                            drawMap();
                        }
                    }
                } else {
                    // 地球の外側（宇宙空間）にマウスがある場合
                    labelEl.style.display = 'none';
                    document.body.style.cursor = 'default';
                    if (hoveredCountryIndex !== null) {
                        hoveredCountryIndex = null;
                        drawMap();
                    }
                }
            }

            // 地球のドラッグ回転処理
            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            globeGroup.rotation.y += deltaMove.x * 0.005;
            globeGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        // --- レイキャスティング法による点の内包判定（数学的アルゴリズム） ---
        function isPointInFeature(lng, lat, feature) {
            const type = feature.geometry.type;
            const coords = feature.geometry.coordinates;
            if (type === 'Polygon') {
                return isPointInPolygon(lng, lat, coords);
            } else if (type === 'MultiPolygon') {
                return coords.some(polygon => isPointInPolygon(lng, lat, polygon));
            }
            return false;
        }

        function isPointInPolygon(lng, lat, polygon) {
            // 外郭線（1つ目のリング）の内側にあるか判定
            const inside = isPointInRing(lng, lat, polygon[0]);
            if (!inside) return false;
            
            // 2つ目以降のリング（湖などの内包する穴）があれば、その中に入っていないか判定
            for (let i = 1; i < polygon.length; i++) {
                if (isPointInRing(lng, lat, polygon[i])) return false;
            }
            return true;
        }

        function isPointInRing(x, y, ring) {
            let inside = false;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const xi = ring[i][0], yi = ring[i][1];
                const xj = ring[j][0], yj = ring[j][1];
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        window.addEventListener('mouseup', () => { isDragging = false; });
        
        // マウスホイールによるズーム処理
        window.addEventListener('wheel', (e) => {
            currentZoom += e.deltaY * 0.1;
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
            camera.position.z = currentZoom;
        }, { passive: true });

        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // 画面リサイズへの対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
