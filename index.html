<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://unpkg.com/globe.gl@2.26.0/dist/globe.gl.min.js"></script>
</head>
<body>

    <div id="globeViz"></div>

    <script>
        // 1. 地球儀を初期化
        const myGlobe = Globe()(document.getElementById('globeViz'))
            .backgroundColor('#000000') // 宇宙（背景）
            .showAtmosphere(true)       // 大気圏を表示
            .atmosphereColor('#3a86ff') // 大気圏の光の色
            .atmosphereDaylightAlpha(0.3);

        // 2. カメラの距離を設定
        myGlobe.pointOfView({ alt: 2.5 });

        // 3. 【重要】真っ黒になるのを防ぐため、3D空間のライトを強制的に自前で点灯させる
        const scene = myGlobe.scene(); // 3D空間を取得
        
        // 全体を均等に照らす明るいライトを追加
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        // 正面から照らすライトを追加して立体感を出す
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
    </script>
</body>
</html>
