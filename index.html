<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe with Face-Triggered Border Highlights</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .info-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            display: none;
            z-index: 10;
            transform: translate(15px, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>

    <div id="info-label" class="info-label"></div>
    <div id="canvas-container"></div>

        globeGroup.add(sphere);

            { name: "カイロ国際空港 (CAI)", country: "エジプト", lat: 30.1219, lng: 31.4056 },
            { name: "ジョモ・ケニヤッタ国際空港 (NBO)", country: "ケニア", lat: -1.3192, lng: 36.9275 },
            { name: "O・R・タンボ国際空港 (JNB)", country: "南アフリカ", lat: -26.1367, lng: 28.2460 },
            { name: "ムルタラ・モハンマド国際空港 (LOS)", country: "ナイジェリア", lat: 6.5774, lng: 3.3210 },
            { name: "ボレ国際空港 (ADD)", country: "エチオピア", lat: 8.9779, lng: 38.7993 },

            // 中南米
            { name: "グアルーリョス国際空港 (GRU)", country: "ブラジル", lat: -23.4356, lng: -46.4731 },
            { name: "ヴィラコッポス国際空港 (VCP)", country: "ブラジル", lat: -23.0074, lng: -47.1344 },
            { name: "ミニストロ・ピスタリーニ国際空港 (EZE)", country: "アルゼンチン", lat: -34.8222, lng: -58.5358 },
            { name: "エルドラド国際空港 (BOG)", country: "コロンビア", lat: 4.7017, lng: -74.1469 },
            { name: "アルトゥーロ・メリノ・ベニテス国際空港 (SCL)", country: "チリ", lat: -33.3930, lng: -70.7858 },
            { name: "ホル Jorge・チャベス国際空港 (LIM)", country: "ペルー", lat: -12.0219, lng: -77.1143 },
            { name: "トクメン国際空港 (PTY)", country: "パナマ", lat: 9.0714, lng: -79.3835 },
            { name: "フアン・サンタマリア国際空港 (SJO)", country: "コスタリカ", lat: 9.9939, lng: -84.2089 },
            { name: "ララ・エレーラ国際空港 (UIO)", country: "エクアドル", lat: -0.1228, lng: -78.3575 }
        ];

        // 緯度経度から3D座標への変換関数
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (-lng + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);

            return new THREE.Vector3(x, y, z);
        }

        // ホバー判定用の「透明な面」を管理する配列と、強調表示用カラーの設定
        const countryMeshes = []; 
        const defaultLineColor = 0xf5f5f5;   // 通常の国境線：明るいクリーム色
        const highlightLineColor = 0x00e6ff; // ホバー時：鮮やかなネオンブルー

        // GeoJSONデータの読み込みと国パーツの生成
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(geoJson => {
                const lineMaterial = new THREE.LineBasicMaterial({ color: defaultLineColor });
                
                // 判定用の「完全に透明な面」マテリアル
                const faceMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xffffff, 
                    transparent: true, 
                    opacity: 0.0, // 透明度0で画面上は見えないようにする
                    side: THREE.DoubleSide
                });

                geoJson.features.forEach(feature => {
                    const type = feature.geometry.type;
                    const coordinates = feature.geometry.coordinates;
                    const countryName = feature.properties.NAME_JA || feature.properties.NAME || "Unknown";
                    const isoA2 = feature.properties.ISO_A2 || feature.properties.iso_a2 || "??";

                    if (type === 'Polygon') {
                        createCountryElement(coordinates, lineMaterial, faceMaterial, countryName, isoA2);
                    } else if (type === 'MultiPolygon') {
                        coordinates.forEach(polygon => {
                            createCountryElement(polygon, lineMaterial, faceMaterial, countryName, isoA2);
                        });
                    }
                });
            });

        // 国境の「線」と、見えない「面」をセットで生成する関数
        function createCountryElement(polygonCoords, lineMat, faceMat, name, iso2) {
            const outerCoords = polygonCoords[0];
            const points = [];
            const shape = new THREE.Shape();

            outerCoords.forEach((coord, index) => {
                const lng = coord[0];
                const lat = coord[1];
                // 描画バグを防ぐため、国境線（Line）を面よりほんの少し外側（RADIUS + 0.15）に配置
                points.push(latLngToVector3(lat, lng, RADIUS + 0.15));

                if(index === 0) {
                    shape.moveTo(lng, lat);
                } else {
                    shape.lineTo(lng, lat);
                }
            });

            // 1. 綺麗に見える「国境線」の生成
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeometry, lineMat.clone());
            globeGroup.add(line);

            // 2. ホバー判定用の「透明な面」の生成
            try {
                const shapeGeom = new THREE.ShapeGeometry(shape);
                const countryMesh = new THREE.Mesh(shapeGeom, faceMat.clone());

                const posAttr = countryMesh.geometry.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const lng = posAttr.getX(i);
                    const lat = posAttr.getY(i);
                    const v3 = latLngToVector3(lat, lng, RADIUS + 0.05);
                    posAttr.setXYZ(i, v3.x, v3.y, v3.z);
                }
                countryMesh.geometry.computeVertexNormals();
                
                // 【重要】透明な面のデータ内に、相方となる「国境線オブジェクト」への参照を保存
                countryMesh.userData = { type: 'country_face', name: name, iso2: iso2, linkedLine: line };
                
                globeGroup.add(countryMesh);
                countryMeshes.push(countryMesh); // レイキャスターの判定対象配列に追加
            } catch(e) {}
        }

        // 空港ピンの生成
        const pins = [];
        const pinGeometry = new THREE.SphereGeometry(1.0, 16, 16);
        const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xff3366 });

        cargoAirports.forEach(airport => {
            const pin = new THREE.Mesh(pinGeometry, pinMaterial);
            const pos = latLngToVector3(airport.lat, airport.lng, RADIUS + 0.4);
            pin.position.copy(pos);
            pin.userData = { type: 'airport', name: airport.name, country: airport.country };
            globeGroup.add(pin);
            pins.push(pin);
        });

        globeGroup.rotation.y = 2.5;

        // マウスインタラクションの設定
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lastHoveredLine = null; // 前回光らせた国境線を記憶する変数

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const airportIntersects = raycaster.intersectObjects(pins);
            
            if (airportIntersects.length > 0) {
                // 空港ピンにホバーした時
                const data = airportIntersects[0].object.userData;
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${data.name}</strong><br><small>国: ${data.country}</small>`;
                document.body.style.cursor = 'pointer';
                
                if (lastHoveredLine) {
                    lastHoveredLine.material.color.set(defaultLineColor);
                    lastHoveredLine = null;
                }
            } else {
                // 「透明な面」に対するホバー判定を行う
                const countryIntersects = raycaster.intersectObjects(countryMeshes);
                
                if (countryIntersects.length > 0) {
                    // 国の面のどこかにマウスが乗った時
                    const hitFace = countryIntersects[0].object;
                    const data = hitFace.userData;
                    const linkedLine = data.linkedLine; // 紐づいている国境線を取得
                    
                    labelEl.style.display = 'block';
                    labelEl.style.left = `${e.clientX}px`;
                    labelEl.style.top = `${e.clientY}px`;
                    labelEl.innerHTML = `<strong>${data.name}</strong> (${data.iso2})`;
                    document.body.style.cursor = 'default';

                    // 別の国に移動した場合、前の国の国境線を通常色に戻す
                    if (lastHoveredLine && lastHoveredLine !== linkedLine) {
                        lastHoveredLine.material.color.set(defaultLineColor);
                    }
                    
                    // 連動する国境線をネオンブルーに強調表示
                    if (linkedLine) {
                        linkedLine.material.color.set(highlightLineColor);
                        lastHoveredLine = linkedLine;
                    }
                } else {
                    // 何もない（海など）場所にマウスがある時
                    labelEl.style.display = 'none';
                    document.body.style.cursor = 'default';
                    
                    if (lastHoveredLine) {
                        lastHoveredLine.material.color.set(defaultLineColor);
                        lastHoveredLine = null;
                    }
                }
            }

            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            globeGroup.rotation.y += deltaMove.x * 0.005;
            globeGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('wheel', (e) => {
            currentZoom += e.deltaY * 0.1;
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
            camera.position.z = currentZoom;
        }, { passive: true });

        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
