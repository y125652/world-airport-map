<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe - TC Areas & Airports</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            z-index: 20;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; }
        .legend { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .color-box { width: 12px; height: 12px; border-radius: 2px; }

        .airport-pin {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 8px #ff3366;
            transition: transform 0.2s;
        }
        .airport-pin:hover {
            transform: translate(-50%, -50%) scale(1.5);
        }

        .airport-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid #fff;
            pointer-events: none;
            display: none;
            z-index: 10;
            transform: translate(10px, -50%);
        }
        .airport-pin:hover + .airport-label {
            display: block;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three-globe": "https://esm.sh/three-globe@2.31.1"
            }
        }
    </script>
</head>
<body>

    <div id="ui-container">
        <h1>World Airport Map (TC Areas)</h1>
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: #3a86ff;"></div> TC1 (Americas)</div>
            <div class="legend-item"><div class="color-box" style="background: #ff006e;"></div> TC2 (Europe/Africa/ME)</div>
            <div class="legend-item"><div class="color-box" style="background: #8338ec;"></div> TC3 (Asia/Oceania)</div>
        </div>
    </div>

    <div id="globeViz"></div>

    <script type="module">
        import * as THREE from 'three';
        import ThreeGlobe from 'three-globe';

        // --- 1. サンプルデータ定義 ---
        const countriesData = {
            type: "FeatureCollection",
            features: [
                { type: "Feature", properties: { NAME: "Japan", ISO_A2: "JP", TC: "TC3" }, geometry: { type: "Polygon", coordinates: [[[140, 40], [145, 40], [145, 35], [140, 35], [140, 40]]] } },
                { type: "Feature", properties: { NAME: "United States", ISO_A2: "US", TC: "TC1" }, geometry: { type: "Polygon", coordinates: [[[-120, 45], [-80, 45], [-80, 35], [-120, 35], [-120, 45]]] } },
                { type: "Feature", properties: { NAME: "United Kingdom", ISO_A2: "GB", TC: "TC2" }, geometry: { type: "Polygon", coordinates: [[[-5, 55], [2, 55], [2, 50], [-5, 50], [-5, 55]]] } },
                { type: "Feature", properties: { NAME: "Singapore", ISO_A2: "SG", TC: "TC3" }, geometry: { type: "Polygon", coordinates: [[[103, 1.4], [104, 1.4], [104, 1.2], [103, 1.2], [103, 1.4]]] } }
            ]
        };

        const airports = [
            { name: "Haneda Airport", code: "HND", lat: 35.5494, lng: 139.7798 },
            { name: "Narita Airport", code: "NRT", lat: 35.7720, lng: 140.3929 },
            { name: "Los Angeles International", code: "LAX", lat: 33.9416, lng: -118.4085 },
            { name: "John F. Kennedy International", code: "JFK", lat: 40.6413, lng: -73.7781 },
            { name: "London Heathrow", code: "LHR", lat: 51.4700, lng: -0.4543 },
            { name: "Singapore Changi", code: "SIN", lat: 1.3502, lng: 103.9893 }
        ];

        const tcColors = {
            'TC1': '#3a86ff',
            'TC2': '#ff006e',
            'TC3': '#8338ec'
        };

        // --- 2. 地球儀の初期化 ---
        const Globe = new ThreeGlobe()
            .globeImageUrl('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?auto=format&fit=crop&w=1000&q=80') // CORS制限のない代替テクスチャ
            .polygonsData(countriesData.features)
            .polygonCapColor(d => tcColors[d.properties.TC] || '#aaaaaa')
            .polygonSideColor(() => 'rgba(255, 255, 255, 0.05)')
            .polygonStrokeColor(() => '#ffffff')
            .polygonLabel(d => `<b>${d.properties.NAME} (${d.properties.ISO_A2})</b>`);

        // --- 3. 空港ピンの追加 ---
        Globe.htmlElementsData(airports)
            .htmlElement(d => {
                const container = document.createElement('div');
                
                const pin = document.createElement('div');
                pin.className = 'airport-pin';
                
                const label = document.createElement('div');
                label.className = 'airport-label';
                label.innerHTML = `<strong>${d.name}</strong> (${d.code})`;
                
                container.appendChild(pin);
                container.appendChild(label);
                return container;
            });

        // --- 4. レンダラーとカメラの設定 ---
        const viz = document.getElementById('globeViz');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viz.clientWidth, viz.clientHeight);
        viz.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.add(Globe);
        scene.add(new THREE.AmbientLight(0xbbbbbb));
        scene.add(new THREE.DirectionalLight(0xffffff, 0.6));

        const camera = new THREE.PerspectiveCamera(50, viz.clientWidth / viz.clientHeight, 1, 1000);
        camera.position.z = 300;

        // --- 5. マウス操作の実装 ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        viz.addEventListener('mousedown', (e) => { isDragging = true; });
        viz.addEventListener('mousemove', (e) => {
            const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
            if (isDragging) {
                Globe.rotation.y += deltaMove.x * 0.005;
                Globe.rotation.x += deltaMove.y * 0.005;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        viz.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.2;
            camera.position.z = Math.min(Math.max(camera.position.z, 150), 500);
            e.preventDefault();
        }, { passive: false });

        // --- 6. アニメーションループ ---
        (function animate() {
            Globe.tick();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        })();

        window.addEventListener('resize', () => {
            camera.aspect = viz.clientWidth / viz.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viz.clientWidth, viz.clientHeight);
        });
    </script>
</body>
</html>
