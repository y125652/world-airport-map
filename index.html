<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe with Border Highlights</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; font-family: Arial, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        .info-label {
            position: absolute; background: rgba(0, 0, 0, 0.85); color: #ffffff;
            padding: 6px 12px; border-radius: 4px; font-size: 13px;
            white-space: nowrap; pointer-events: none; display: none;
            z-index: 10; transform: translate(15px, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>

    <div id="info-label" class="info-label"></div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const labelEl = document.getElementById('info-label');
        const RADIUS = 70;

        // シーンとカメラの設定
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        let currentZoom = 180;
        const MIN_ZOOM = 90;
        const MAX_ZOOM = 300;
        camera.position.z = currentZoom;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xffffff, 1);
        container.appendChild(renderer.domElement);

        // 地球グループ
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        // 1. 海の色をネイビーに
        const sphereGeometry = new THREE.SphereGeometry(RADIUS, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0x1a237e }); // ネイビー
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        globeGroup.add(sphere);

        // 貨物空港データ
        const cargoAirports = [
            // アジアー・オセアニア
            { name: "成田国際空港 (NRT)", country: "日本", lat: 35.7720, lng: 140.3929 },
            { name: "関西国際空港 (KIX)", country: "日本", lat: 34.4320, lng: 135.2303 },
            { name: "香港国際空港 (HKG)", country: "香港", lat: 22.3080, lng: 113.9185 },
            { name: "上海浦東国際空港 (PVG)", country: "中国", lat: 31.1443, lng: 121.8083 },
            { name: "北京首都国際空港 (PEK)", country: "中国", lat: 40.0799, lng: 116.6031 },
            // ... (他の空港データは元のコードと同じ)
        ];

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (-lng + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);
            return new THREE.Vector3(x, y, z);
        }

        // 2. 陸の色を明るいクリーム色に
        const landLines = []; // 国境線のメッシュを格納する配列
        const defaultLineColor = 0xf5f5f5; // 明るいクリーム色/グレー
        const highlightLineColor = 0x00e6ff; // ホバー時のネオンブルー

        // GeoJSONデータの取得と描画
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(geoJson => {
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: defaultLineColor, // デフォルトの明るい色
                    linewidth: 1, // 基本の太さ
                });

                geoJson.features.forEach(feature => {
                    const type = feature.geometry.type;
                    const coordinates = feature.geometry.coordinates;
                    const countryName = feature.properties.NAME_JA || feature.properties.NAME || "Unknown";
                    const isoA2 = feature.properties.ISO_A2 || feature.properties.iso_a2 || "??";

                    if (type === 'Polygon') {
                        createCountryLine(coordinates, lineMaterial.clone(), countryName, isoA2);
                    } else if (type === 'MultiPolygon') {
                        coordinates.forEach(polygon => {
                            createCountryLine(polygon, lineMaterial.clone(), countryName, isoA2);
                        });
                    }
                });
            });

        function createCountryLine(polygonCoords, lineMat, name, iso2) {
            const outerCoords = polygonCoords[0];
            const points = [];

            outerCoords.forEach((coord) => {
                const lng = coord[0];
                const lat = coord[1];
                points.push(latLngToVector3(lat, lng, RADIUS + 0.1));
            });

            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeometry, lineMat);
            
            // 国境線にデータを保存し、配列に追加
            line.userData = { type: 'country_border', name: name, iso2: iso2 };
            globeGroup.add(line);
            landLines.push(line);
        }

        const pins = [];
        const pinGeometry = new THREE.SphereGeometry(1.0, 16, 16);
        const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xff3366 });

        cargoAirports.forEach(airport => {
            const pin = new THREE.Mesh(pinGeometry, pinMaterial);
            const pos = latLngToVector3(airport.lat, airport.lng, RADIUS + 0.4);
            pin.position.copy(pos);
            pin.userData = { type: 'airport', name: airport.name, country: airport.country };
            globeGroup.add(pin);
            pins.push(pin);
        });

        globeGroup.rotation.y = 2.5;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lastHoveredBorder = null;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            // 3. 空港ピンのホバー判定
            const airportIntersects = raycaster.intersectObjects(pins);
            
            // 4. 国境線のホバー判定 (面ではなく線に対して判定)
            const borderIntersects = raycaster.intersectObjects(landLines, true);
            
            if (airportIntersects.length > 0) {
                const data = airportIntersects[0].object.userData;
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${data.name}</strong><br><small>国: ${data.country}</small>`;
                document.body.style.cursor = 'pointer';
                
                if (lastHoveredBorder) {
                    lastHoveredBorder.material.color.set(defaultLineColor); // 色を戻す
                    lastHoveredBorder = null;
                }
            } else {
                if (borderIntersects.length > 0) {
                    const hitBorder = borderIntersects[0].object;
                    const data = hitBorder.userData;
                    
                    labelEl.style.display = 'block';
                    labelEl.style.left = `${e.clientX}px`;
                    labelEl.style.top = `${e.clientY}px`;
                    labelEl.innerHTML = `<strong>${data.name}</strong> (${data.iso2})`;
                    document.body.style.cursor = 'default';

                    // 5. ホバー時の国境線強調処理
                    if (lastHoveredBorder && lastHoveredBorder !== hitBorder) {
                        lastHoveredBorder.material.color.set(defaultLineColor); // 前の国を戻す
                    }
                    hitBorder.material.color.set(highlightLineColor); // 新しい国をネオンブルーに
                    lastHoveredBorder = hitBorder;
                } else {
                    labelEl.style.display = 'none';
                    document.body.style.cursor = 'default';
                    
                    if (lastHoveredBorder) {
                        lastHoveredBorder.material.color.set(defaultLineColor); // 色を戻す
                        lastHoveredBorder = null;
                    }
                }
            }

            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            globeGroup.rotation.y += deltaMove.x * 0.005;
            globeGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('wheel', (e) => {
            currentZoom += e.deltaY * 0.1;
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
            camera.position.z = currentZoom;
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
