<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Vector Globe - Perfect Render & Depth Fix</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a237e; /* 宇宙（背景）をディープネイビーに */
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .info-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            display: none;
            z-index: 10;
            transform: translate(15px, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

        scene.add(globeGroup);

            { name: "カイロ国際空港 (CAI)", country: "エジプト", lat: 30.1219, lng: 31.4056 },
            { name: "ジョモ・ケニヤッタ国際空港 (NBO)", country: "ケニア", lat: -1.3192, lng: 36.9275 },
            { name: "O・R・タンボ国際空港 (JNB)", country: "南アフリカ", lat: -26.1367, lng: 28.2460 },
            { name: "ムルタラ・モハンマド国際空港 (LOS)", country: "ナイジェリア", lat: 6.5774, lng: 3.3210 },
            { name: "ボレ国際空港 (ADD)", country: "エチオピア", lat: 8.9779, lng: 38.7993 },
            { name: "グアルーリョス国際空港 (GRU)", country: "ブラジル", lat: -23.4356, lng: -46.4731 },
            { name: "ヴィラコッポス国際空港 (VCP)", country: "ブラジル", lat: -23.0074, lng: -47.1344 },
            { name: "ミニストロ・ピスタリーニ国際空港 (EZE)", country: "アルゼンチン", lat: -34.8222, lng: -58.5358 },
            { name: "エルドラド国際空港 (BOG)", country: "コロンビア", lat: 4.7017, lng: -74.1469 },
            { name: "アルトゥーロ・メリノ・ベニテス国際空港 (SCL)", country: "チリ", lat: -33.3930, lng: -70.7858 },
            { name: "ホル豪・チャベス国際空港 (LIM)", country: "ペルー", lat: -12.0219, lng: -77.1143 },
            { name: "トクメン国際空港 (PTY)", country: "パナマ", lat: 9.0714, lng: -79.3835 },
            { name: "フアン・サンタマリア国際空港 (SJO)", country: "コスタリカ", lat: 9.9939, lng: -84.2089 },
            { name: "マリスカル・スクレ国際空港 (UIO)", country: "エクアドル", lat: -0.1228, lng: -78.3575 }
        ];

        // 経度緯度を3D空間の球体座標に変換
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (-lng - 90) * (Math.PI / 180);
            
            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);
            return new THREE.Vector3(x, y, z);
        }

        // --- ベース球体（海）の設定 ---
        const baseGeometry = new THREE.SphereGeometry(RADIUS, 64, 64);
        const baseMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x1a237e, // 海のディープブルー
            transparent: true,
            opacity: 0.4,    // スケルトンスタイルを維持
            side: THREE.DoubleSide
        });
        const baseGlobe = new THREE.Mesh(baseGeometry, baseMaterial);
        // 海の描画順序を一番後ろ(0)に固定
        baseGlobe.renderOrder = 0; 
        globeGroup.add(baseGlobe);

        // カラーパレット
        const COLOR_BORDER = 0xffffff;    // 国境線: クッキリした白
        const COLOR_LAND_FILL = 0x283593; // 陸地の平時塗りつぶし: 海より少し明るいネイビー
        const COLOR_HIGHLIGHT = 0x00e6ff; // ホバー時: 鮮やかなネオンブルー

        // 国境線の共通マテリアル
        const lineMaterial = new THREE.LineBasicMaterial({ 
            color: COLOR_BORDER,
            transparent: true,
            opacity: 0.6
        });
        
        // ミニマルGeoJSONデータの読み込みと展開
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(geoJson => {
                geoJson.features.forEach((feature, countryIndex) => {
                    const countryGroup = new THREE.Group();
                    const countryName = feature.properties.NAME_JA || feature.properties.NAME || "Unknown";
                    const isoA2 = feature.properties.ISO_A2 || feature.properties.iso_a2 || "??";
                    
                    countryGroup.userData = { index: countryIndex, name: countryName, iso: isoA2 };

                    const type = feature.geometry.type;
                    const coordinates = feature.geometry.coordinates;

                    if (type === 'Polygon') {
                        processPolygon(coordinates, countryGroup);
                    } else if (type === 'MultiPolygon') {
                        coordinates.forEach(polygon => processPolygon(polygon, countryGroup));
                    }

                    globeGroup.add(countryGroup);
                });
            });

        function processPolygon(polygon, group) {
            const ring = polygon[0];
            const points = [];

            // 1. 国境線（3D Line）用座標
            ring.forEach(coord => {
                // 線を海（RADIUS）のほんのわずか外側に配置（Zファイティング防止）
                const vec = latLngToVector3(coord[1], coord[0], RADIUS + 0.15);
                points.push(vec);
            });

            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeometry, lineMaterial);
            line.renderOrder = 2; // 線は最前面に描画
            group.add(line);

            // 2. 塗りつぶしの面（Shape）の生成
            const shape = new THREE.Shape();
            ring.forEach((coord, i) => {
                if (i === 0) shape.moveTo(coord[0], coord[1]);
                else shape.lineTo(coord[0], coord[1]);
            });

            const shapeGeometry = new THREE.ShapeGeometry(shape);
            const posAttr = shapeGeometry.attributes.position;
            
            // 2D平面のShapeの頂点を、完璧な3D球体面（海より0.1だけ外側）へと置換
            for (let i = 0; i < posAttr.count; i++) {
                const lng = posAttr.getX(i);
                const lat = posAttr.getY(i);
                const vec3 = latLngToVector3(lat, lng, RADIUS + 0.05); 
                posAttr.setXYZ(i, vec3.x, vec3.y, vec3.z);
            }
            shapeGeometry.computeVertexNormals();

            // 陸地のマテリアル設定（【★ここがバグ修正の肝】）
            const meshMaterial = new THREE.MeshBasicMaterial({ 
                color: COLOR_LAND_FILL,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85,          // 表面でも海を透過させずクッキリ白（青）く塗る
                depthTest: true,       // 3Dの前後判定は有効にしつつ
                depthWrite: true
            });

            const countryMesh = new THREE.Mesh(shapeGeometry, meshMaterial);
            countryMesh.userData = group.userData; 
            
            // 【最重要】描画順を海(0)よりも手前(1)に強制設定。これで表面でも絶対に潜り込みません！
            countryMesh.renderOrder = 1; 
            
            group.add(countryMesh);
            countryMeshes.push(countryMesh); 
        }

        // 貨物空港ピン（赤色の球体）
        const pins = [];
        const pinGeometry = new THREE.SphereGeometry(0.8, 16, 16);
        const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xff3366 });

        cargoAirports.forEach(airport => {
            const pin = new THREE.Mesh(pinGeometry, pinMaterial);
            const pos = latLngToVector3(airport.lat, airport.lng, RADIUS + 0.3);
            pin.position.copy(pos);
            pin.userData = { type: 'airport', name: airport.name, country: airport.country };
            pin.renderOrder = 3; // ピンは全ての要素の最前面に
            globeGroup.add(pin);
            pins.push(pin);
        });

        // マウスコントロールとインタラクション
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lastHoveredMesh = null;

        // 【★裏側の国が誤反応するのを防ぐため、レイキャスターの表裏判定を厳格化】
        raycaster.params.Mesh.side = THREE.FrontSide;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            // 1. 空港ピンのホバー判定
            const airportIntersects = raycaster.intersectObjects(pins);
            
            if (airportIntersects.length > 0) {
                const data = airportIntersects[0].object.userData;
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${data.name}</strong><br><small>国: ${data.country}</small>`;
                document.body.style.cursor = 'pointer';
                
                if (lastHoveredMesh) {
                    lastHoveredMesh.material.color.setHex(COLOR_LAND_FILL);
                    lastHoveredMesh = null;
                }
            } else {
                // 2. 国のホバー判定
                const countryIntersects = raycaster.intersectObjects(countryMeshes);
                
                if (countryIntersects.length > 0) {
                    // カメラから最も近い（手前側にある）交差点のメッシュを取得
                    const hitMesh = countryIntersects[0].object;
                    const data = hitMesh.userData;

                    labelEl.style.display = 'block';
                    labelEl.style.left = `${e.clientX}px`;
                    labelEl.style.top = `${e.clientY}px`;
                    labelEl.innerHTML = `<strong>${data.name}</strong> (${data.iso})`;
                    document.body.style.cursor = 'default';

                    if (lastHoveredMesh !== hitMesh) {
                        if (lastHoveredMesh) lastHoveredMesh.material.color.setHex(COLOR_LAND_FILL);
                        hitMesh.material.color.setHex(COLOR_HIGHLIGHT); // 手前側でネオンブルーに点灯
                        lastHoveredMesh = hitMesh;
                    }
                } else {
                    labelEl.style.display = 'none';
                    document.body.style.cursor = 'default';
                    if (lastHoveredMesh) {
                        lastHoveredMesh.material.color.setHex(COLOR_LAND_FILL);
                        lastHoveredMesh = null;
                    }
                }
            }

            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            globeGroup.rotation.y += deltaMove.x * 0.005;
            globeGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        
        window.addEventListener('wheel', (e) => {
            currentZoom += e.deltaY * 0.1;
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
            camera.position.z = currentZoom;
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
