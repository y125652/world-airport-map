<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe - TC Areas & Airports</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
        /* UIレイヤー */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; }
        .legend { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .color-box { width: 12px; height: 12px; border-radius: 2px; }

        /* 空港ピンのスタイル */
        .airport-pin {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 8px #ff3366;
            transition: transform 0.2s;
        }
        .airport-pin:hover {
            transform: translate(-50%, -50%) scale(1.5);
        }

        /* ポップアップ（ツールチップ） */
        .airport-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid #fff;
            pointer-events: none;
            display: none;
            z-index: 10;
            transform: translate(10px, -50%);
        }
        .airport-pin:hover + .airport-label {
            display: block;
        }
    </style>

    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/three-globe"></script>
</head>
<body>

    <div id="ui-container">
        <h1>World Airport Map (TC Areas)</h1>
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: #3a86ff;"></div> TC1 (Americas)</div>
            <div class="legend-item"><div class="color-box" style="background: #ff006e;"></div> TC2 (Europe/Africa/ME)</div>
            <div class="legend-item"><div class="color-box" style="background: #8338ec;"></div> TC3 (Asia/Oceania)</div>
        </div>
    </div>

    <div id="globeViz"></div>

    <script>
        // --- 1. サンプルデータ定義 ---
        // TCエリア判定を含めた国データ（簡易版GeoJSON構造）
        const countriesData = {
            type: "FeatureCollection",
            features: [
                { type: "Feature", properties: { NAME: "Japan", ISO_A2: "JP", TC: "TC3" }, geometry: { type: "Polygon", coordinates: [[[140, 40], [145, 40], [145, 35], [140, 35], [140, 40]]] } }, // 簡易的な四角形
                { type: "Feature", properties: { NAME: "United States", ISO_A2: "US", TC: "TC1" }, geometry: { type: "Polygon", coordinates: [[[-120, 45], [-80, 45], [-80, 35], [-120, 35], [-120, 45]]] } },
                { type: "Feature", properties: { NAME: "United Kingdom", ISO_A2: "GB", TC: "TC2" }, geometry: { type: "Polygon", coordinates: [[[-5, 55], [2, 55], [2, 50], [-5, 50], [-5, 55]]] } },
                { type: "Feature", properties: { NAME: "Singapore", ISO_A2: "SG", TC: "TC3" }, geometry: { type: "Polygon", coordinates: [[[103, 1.4], [104, 1.4], [104, 1.2], [103, 1.2], [103, 1.4]]] } }
            ]
        };

        // 空港データ (緯度, 経度, 空港名, 3レター)
        const airports = [
            { name: "Haneda Airport", code: "HND", lat: 35.5494, lng: 139.7798 },
            { name: "Narita Airport", code: "NRT", lat: 35.7720, lng: 140.3929 },
            { name: "Los Angeles International", code: "LAX", lat: 33.9416, lng: -118.4085 },
            { name: "John F. Kennedy International", code: "JFK", lat: 40.6413, lng: -73.7781 },
            { name: "London Heathrow", code: "LHR", lat: 51.4700, lng: -0.4543 },
            { name: "Singapore Changi", code: "SIN", lat: 1.3502, lng: 103.9893 }
        ];

        // TCエリアごとの色分け設定
        const tcColors = {
            'TC1': '#3a86ff', // 青
            'TC2': '#ff006e', // 赤ピンク
            'TC3': '#8338ec'  // 紫
        };

        // --- 2. 地球儀の初期化 ---
        const Globe = new ThreeGlobe()
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg') // 地球の表面テクスチャ
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png') // 凹凸
            
            // 国境線と塗りつぶしの設定
            .polygonsData(countriesData.features)
            .polygonCapColor(d => tcColors[d.properties.TC] || '#aaaaaa')
            .polygonSideColor(() => 'rgba(255, 255, 255, 0.05)')
            .polygonStrokeColor(() => '#ffffff') // 国境線
            .polygonLabel(d => `<b>${d.properties.NAME} (${d.properties.ISO_A2})</b>`); // ホバー時の国名表示

        // --- 3. 空港ピン（HTML要素）の追加 ---
        // ThreeGlobeの「htmlElements」機能を使って、3D空間上の座標にHTMLのピンを配置します
        Globe.htmlElementsData(airports)
            .htmlElement(d => {
                const container = document.createElement('div');
                
                // ピン要素
                const pin = document.createElement('div');
                pin.className = 'airport-pin';
                
                // ラベル要素（ホバー時に表示）
                const label = document.createElement('div');
                label.className = 'airport-label';
                label.innerHTML = `<strong>${d.name}</strong> (${d.code})`;
                
                container.appendChild(pin);
                container.appendChild(label);
                return container;
            });

        // --- 4. Three.js レンダラーとカメラの設定（画面への描画） ---
        const viz = document.getElementById('globeViz');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viz.clientWidth, viz.clientHeight);
        viz.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.add(Globe);
        scene.add(new THREE.AmbientLight(0xbbbbbb));
        scene.add(new THREE.DirectionalLight(0xffffff, 0.6));

        const camera = new THREE.PerspectiveCamera(50, viz.clientWidth / viz.clientHeight, 1, 1000);
        camera.position.z = 300;

        // --- 5. マウス操作（回転・ズーム）の実装 ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        viz.addEventListener('mousedown', (e) => { isDragging = true; });
        viz.addEventListener('mousemove', (e) => {
            const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
            if (isDragging) {
                // ドラッグで地球儀を回転
                Globe.rotation.y += deltaMove.x * 0.005;
                Globe.rotation.x += deltaMove.y * 0.005;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // マウスホイールでのズーム
        viz.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.2;
            camera.position.z = Math.min(Math.max(camera.position.z, 150), 500); // ズーム制限
            e.preventDefault();
        }, { passive: false });

        // --- 6. アニメーションループ ---
        (function animate() {
            // 自動回転させたい場合は以下のコメントアウトを解除してください
            // if (!isDragging) Globe.rotation.y += 0.001;

            Globe.tick(); // HTML要素の位置更新に必要
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        })();

        // ウィンドウサイズ変更への対応
        window.addEventListener('resize', () => {
            camera.aspect = viz.clientWidth / viz.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viz.clientWidth, viz.clientHeight);
        });
    </script>
</body>
</html>
