<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D世界空港地球儀マップ</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030408; /* Space black */
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globe-container {
            width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center;
        }
        path, circle, text, svg {
            outline: none !important;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        /* Refined, focused tooltip centered above the globe */
        #tooltip {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%); background: rgba(10, 16, 35, 0.95);
            color: #fff; padding: 10px 35px; border-radius: 30px;
            font-size: 18px; font-weight: bold; border: 1px solid #00aaff;
            pointer-events: none; z-index: 1000; display: none;
            box-shadow: 0 4px 25px rgba(0,170,255,0.4); text-align: center;
        }
    </style>
</head>
<body>

    <div id="tooltip"></div>
    <div id="globe-container">
        <svg id="globe"></svg>
    </div>

    <script>
        // --- 📊 Major World Airports Data, focused on specific airports ---
        const airportData = [
            // Focused airports for Japan
            { name: "東京国際空港", iata: "HND", country: "JP", lat: 35.549, lon: 139.780 },
            { name: "成田国際空港", iata: "NRT", country: "JP", lat: 35.772, lon: 140.393 },
            { name: "関西国際空港", iata: "KIX", country: "JP", lat: 34.432, lon: 135.230 },
            { name: "新千歳空港", iata: "CTS", country: "JP", lat: 42.775, lon: 141.692 },
            { name: "福岡空港", iata: "FUK", country: "JP", lat: 33.585, lon: 130.450 },
            { name: "那覇空港", iata: "OKA", country: "JP", lat: 26.195, lon: 127.646 },
            
            // Focused airports for other sample countries (for variety)
            { name: "Incheon Intl", iata: "ICN", country: "KR", lat: 37.460, lon: 126.440 },
            { name: "Taiwan Taoyuan", iata: "TPE", country: "TW", lat: 25.079, lon: 121.234 },
            { name: "Beijing Capital", iata: "PEK", country: "CN", lat: 40.079, lon: 116.603 },
            { name: "John F. Kennedy", iata: "JFK", country: "US", lat: 40.641, lon: -73.778 },
            { name: "London Heathrow", iata: "LHR", country: "GB", lat: 51.470, lon: -0.454 },
            { name: "Paris Charles de Gaulle", iata: "CDG", country: "FR", lat: 49.009, lon: 2.547 },
            { name: "Dubai Intl", iata: "DXB", country: "AE", lat: 25.253, lon: 55.364 }
        ];

        // Country code mappings (ISO 3 to ISO 2)
        const iso3ToIso2 = { "JPN":"JP","KOR":"KR","TWN":"TW","CHN":"CN","USA":"US","GBR":"GB","FRA":"FR","ARE":"AE" };

        const width = window.innerWidth;
        const height = window.innerHeight;
        // 🔄 Rotation sensitivity reduced further for slower, smoother rotation
        const sensitivity = 0.15; 

        const svg = d3.select("#globe")
            .attr("width", width)
            .attr("height", height);

        // 3D globe (orthographic projection) setup
        const projection = d3.geoOrthographic()
            .scale(280) // Initial scale
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        // 🌊 Solid ocean background circle (deep blue marble color)
        const ocean = svg.append("circle")
            .attr("cx", width / 2)
            .attr("cy", height / 2)
            .attr("r", projection.scale())
            .style("fill", "#0a1128")
            .style("stroke", "none");

        const mapGroup = svg.append("g");  // Land layer
        const pinsGroup = svg.append("g"); // Airports layer

        // 🗺️ Use TopoJSON for a clean, non-overlapping country structure
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
            .then(function(world) {
                // Convert TopoJSON to GeoJSON
                const countries = topojson.feature(world, world.objects.countries).features;

                // Render landmasses
                mapGroup.selectAll(".country")
                    .data(countries)
                    .enter().append("path")
                    .attr("class", "country")
                    .attr("d", path)
                    // High-contrast, matte grey land color
                    .style("fill", "#1f3147")
                    .style("stroke", "white") // Distinct white borders
                    .style("stroke-width", "1px")
                    
                    // 🔎 Improved, stable hover detection
                    .on("mouseover", function(event, d) {
                        const name = d.properties.name || "不明な国";
                        
                        // Robust code retrieval
                        let iso3 = d.id || "";
                        if (iso3.length !== 3 && d.properties.iso_a3) iso3 = d.properties.iso_a3;
                        const iso2 = iso3ToIso2[iso3] || "";

                        // Corrected: Tooltip now displays 'Country Name (ISO Code)'
                        d3.select("#tooltip")
                            .html(`🌍 ${name} (${iso2})`)
                            .style("display", "block");

                        // Vibrant cyan highlight color
                        d3.select(this).style("fill", "#00aaff");

                        // Dynamically render airport pins and labels
                        showAirports(iso2);
                    })
                    
                    .on("mouseout", function() {
                        d3.select("#tooltip").style("display", "none");
                        d3.select(this).style("fill", "#1f3147"); // Reset land color
                        pinsGroup.selectAll("*").remove(); // Remove all pins
                    });

                // 🔄 Rotation interaction with refined, low sensitivity
                svg.call(d3.drag().on("drag", function(event) {
                    const rotate = projection.rotate();
                    // dx/dy values modified by the reduced sensitivity
                    projection.rotate([
                        rotate[0] + event.dx * sensitivity,
                        rotate[1] - event.dy * sensitivity
                    ]);
                    refreshAll();
                }));

                // Smooth wheel zoom interaction
                svg.call(d3.zoom()
                    .scaleExtent([0.5, 5]) // Limit zoom scale
                    .on("zoom", function(event) {
                        // Rescale the globe based on zoom
                        projection.scale(280 * event.transform.k);
                        refreshAll();
                    })
                );
            });

        // Function to refresh the visual state of the globe
        function refreshAll() {
            svg.selectAll(".country").attr("d", path);
            ocean.attr("r", projection.scale());
            updatePins();
        }

        // --- ✈️ Dynamic Airport Pins and Labels Function ---
        function showAirports(countryCode) {
            pinsGroup.selectAll("*").remove(); // Clear previous pins

            const localAirports = airportData.filter(ap => ap.country === countryCode);

            localAirports.forEach(ap => {
                const geoPoint = { "type": "Point", "coordinates": [ap.lon, ap.lat] };
                
                // Add airport pin (red circle marker)
                pinsGroup.append("circle")
                    .datum(geoPoint)
                    .attr("class", "airport-pin")
                    .attr("r", 5)
                    .style("fill", "#ff3300")
                    .style("stroke", "#ffffff")
                    .style("stroke-width", "1.5px");

                // Corrected: Dynamic text labels show '✈️ Airport Name [IATA]'
                pinsGroup.append("text")
                    .datum(geoPoint)
                    .attr("class", "airport-text")
                    .text(`✈️ ${ap.name} [${ap.iata}]`)
                    .attr("dx", 10)
                    .attr("dy", 4)
                    .style("fill", "#ffcc00") // Warm yellow labels
                    .style("font-size", "12px")
                    .style("font-weight", "bold")
                    .style("text-shadow", "2px 2px 3px #000"); // Add text shadow for visibility
            });

            updatePins();
        }

        // Function to update the 3D position and visibility of pins
        function updatePins() {
            // Pin circles
            pinsGroup.selectAll(".airport-pin")
                .attr("cx", d => projection(d.coordinates)[0])
                .attr("cy", d => projection(d.coordinates)[1])
                .style("display", d => {
                    // Corrected: Uses proper orthographic visibility logic
                    const gpath = d3.geoPath().projection(projection);
                    return gpath(d) ? "inline" : "none";
                });

            // Airport text labels
            pinsGroup.selectAll(".airport-text")
                .attr("x", d => projection(d.coordinates)[0])
                .attr("y", d => projection(d.coordinates)[1])
                .style("display", d => {
                    const gpath = d3.geoPath().projection(projection);
                    return gpath(d) ? "inline" : "none";
                });
        }

        // Standard resize handler
        window.addEventListener("resize", function() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            svg.attr("width", w).attr("height", h);
            projection.translate([w / 2, h / 2]);
            ocean.attr("cx", w / 2).attr("cy", h / 2);
            refreshAll();
        });

    </script>
</body>
</html>
