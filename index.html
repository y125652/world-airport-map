<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe with World Borders</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff; /* 背景は白 */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const RADIUS = 70; // 地球の半径

        // 1. シーンとカメラの設定
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 180;

        // 2. レンダラーの設定
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xffffff, 1);
        container.appendChild(renderer.domElement);

        // 3. 地球（ベースの青い球体）の作成
        const globeGroup = new THREE.Group();
        const sphereGeometry = new THREE.SphereGeometry(RADIUS, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0x3a86ff }); // フラットな青
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        globeGroup.add(sphere);

        // 4. 緯度・経度を3D空間の座標（XYZ）に変換する関数
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);

            return new THREE.Vector3(x, y, z);
        }

        // 5. 世界地図の国境線データを取得して描画
        // 公開されている軽量な世界地図GeoJSON（ローカルCORS制限のないソース）
        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
            .then(res => res.json())
            .then(geoJson => {
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff }); // 白い国境線

                geoJson.features.forEach(feature => {
                    const type = feature.geometry.type;
                    const coordinates = feature.geometry.coordinates;

                    // Polygon（単一の国）または MultiPolygon（島国など複数のポリゴンを持つ国）の処理
                    if (type === 'Polygon') {
                        drawPolygon(coordinates[0], lineMaterial);
                    } else if (type === 'MultiPolygon') {
                        coordinates.forEach(polygon => {
                            drawPolygon(polygon[0], lineMaterial);
                        });
                    }
                });
            });

        // ポリゴン（線の配列）を球体の上に描画するヘルパー関数
        function drawPolygon(coords, material) {
            const points = [];
            coords.forEach(coord => {
                const lng = coord[0];
                const lat = coord[1];
                // 球体の表面よりわずかに外側（RADIUS + 0.3）に配置して線の埋もれを防ぐ
                points.push(latLngToVector3(lat, lng, RADIUS + 0.3));
            });

            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeometry, material);
            globeGroup.add(line);
        }

        scene.add(globeGroup);

        // 6. マウスでコロコロ転がす操作の実装
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            // 地球儀を転がす
            globeGroup.rotation.y += deltaMove.x * 0.005;
            globeGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 7. 描画ループ
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // 画面サイズ変更への対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
