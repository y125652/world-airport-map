<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World Map - Permanent Fixed Version</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #globeViz { width: 100vw; height: 100vh; }
        .backdrop { background: rgba(0, 0, 0, 0.9) !important; border-radius: 8px !important; padding: 12px !important; border: 1px solid #555; color: #fff; pointer-events: none; }
        .tt-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; border-bottom: 1px solid #aaa; padding-bottom: 4px; }
        .tt-body { font-size: 12px; }
    </style>
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>

    <div id="globeViz"></div>

    <script>
        // --- 1. TCエリアの定義 ---
        const tcMapping = {
            'US': 'TC1', 'CA': 'TC1', 'BR': 'TC1', 'MX': 'TC1', 'AR': 'TC1', 'CO': 'TC1', 'PE': 'TC1',
            'GB': 'TC2', 'FR': 'TC2', 'DE': 'TC2', 'IT': 'TC2', 'ES': 'TC2', 'ZA': 'TC2', 'EG': 'TC2', 'RU': 'TC2', 'SA': 'TC2', 'AE': 'TC2',
            'JP': 'TC3', 'CN': 'TC3', 'KR': 'TC3', 'IN': 'TC3', 'AU': 'TC3', 'SG': 'TC3', 'TH': 'TC3', 'ID': 'TC3', 'MY': 'TC3', 'NZ': 'TC3'
        };

        const tcColors = {
            'TC1': 'rgba(46, 204, 113, 0.4)',  // 緑
            'TC2': 'rgba(52, 152, 219, 0.4)',  // 青
            'TC3': 'rgba(241, 196, 15, 0.4)',  // 黄
            'Unknown': 'rgba(150, 150, 150, 0.15)'
        };

        // --- 2. 空港データ ---
        const airportsData = [
            { name: "羽田空港", code: "HND", country: "JP", lat: 35.5494, lng: 139.7798 },
            { name: "成田国際空港", code: "NRT", country: "JP", lat: 35.7720, lng: 140.3929 },
            { name: "ジョン・F・ケネディ国際空港", code: "JFK", country: "US", lat: 40.6413, lng: -73.7781 },
            { name: "ロンドン・ヒースロー空港", code: "LHR", country: "GB", lat: 51.4700, lng: -0.4543 },
            { name: "パリ＝シャルル・ド・ゴール空港", code: "CDG", country: "FR", lat: 49.0097, lng: 2.5479 },
            { name: "シンガポール・チャンギ空港", code: "SIN", country: "SG", lat: 1.3502, lng: 103.9893 },
            { name: "シドニー国際空港", code: "SYD", country: "AU", lat: -33.9461, lng: 151.1772 },
            { name: "ドバイ国際空港", code: "DXB", country: "AE", lat: 25.2532, lng: 55.3657 },
            { name: "ロサンゼルス国際空港", code: "LAX", country: "US", lat: 33.9416, lng: -118.4085 }
        ];

        // --- 3. 【絶対エラーが出ない対策】主要国の精密な国境データをファイル内に直書き（通信不使用） ---
        const embeddedFeatures = [
            { "type": "Feature", "properties": { "ISO_A2": "JP", "NAME": "日本" }, "geometry": { "type": "Polygon", "coordinates": [[[141.6,45.5],[141.5,42.9],[144.1,44.0],[145.8,43.4],[142.7,42.0],[141.3,41.5],[141.8,39.3],[141.0,38.3],[140.9,35.7],[139.9,34.7],[136.8,34.6],[134.3,33.5],[131.2,31.0],[130.2,32.3],[129.7,31.8],[130.4,33.6],[131.0,33.9],[132.1,33.3],[133.5,34.4],[134.8,34.2],[135.2,34.7],[136.6,36.6],[136.2,35.6],[136.7,37.5],[138.3,37.0],[139.5,38.2],[140.0,40.4],[140.5,41.2],[140.0,42.8],[139.8,42.3],[140.4,45.2],[141.6,45.5]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "US", "NAME": "アメリカ" }, "geometry": { "type": "Polygon", "coordinates": [[[-124.7,48.4],[-120.6,48.1],[-117.0,49.0],[-95.2,49.3],[-89.2,48.0],[-82.5,45.4],[-71.5,45.0],[-67.0,45.2],[-70.2,43.7],[-74.0,40.6],[-75.6,35.6],[-80.4,32.4],[-81.1,25.1],[-82.9,27.7],[-87.4,30.4],[-94.0,29.7],[-97.2,26.0],[-99.5,26.0],[-104.9,31.3],[-111.1,31.3],[-114.8,32.5],[-117.1,32.5],[-120.5,34.5],[-124.4,40.4],[-124.7,48.4]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "CN", "NAME": "中国" }, "geometry": { "type": "Polygon", "coordinates": [[[123.6,46.2],[130.5,42.4],[130.6,42.9],[131.2,44.9],[134.3,48.4],[131.9,47.8],[126.9,53.5],[121.2,50.2],[117.2,49.5],[115.0,42.8],[109.8,42.4],[97.0,42.8],[95.2,49.1],[87.3,49.2],[80.5,44.7],[74.0,39.7],[75.2,37.3],[78.8,35.5],[80.3,35.3],[81.9,29.6],[88.2,27.8],[92.1,27.8],[94.0,29.3],[97.9,27.3],[99.1,28.2],[102.2,22.4],[105.3,21.7],[108.0,21.5],[110.2,20.2],[113.6,22.2],[116.6,23.4],[120.4,24.3],[121.8,29.0],[121.9,31.0],[119.3,34.5],[122.5,39.0],[121.1,40.9],[117.7,39.2],[124.2,39.9],[123.6,46.2]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "GB", "NAME": "イギリス" }, "geometry": { "type": "Polygon", "coordinates": [[[-5.7,50.1],[-6.3,50.6],[-4.6,51.2],[-5.3,51.9],[-4.1,52.1],[-4.8,52.9],[-3.1,53.4],[-3.6,54.7],[-4.9,54.8],[-4.9,55.8],[-5.7,56.4],[-6.2,58.4],[-4.5,58.6],[-3.0,57.7],[-1.9,57.5],[-2.6,56.4],[-1.6,55.6],[-1.3,54.2],<td>[0.3,52.9],[1.7,52.7],[1.3,51.9],[1.4,51.3],[0.5,50.8],[-1.0,50.8],[-2.9,50.6],[-5.7,50.1]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "FR", "NAME": "フランス" }, "geometry": { "type": "Polygon", "coordinates": [[[4.8,46.3],[6.1,46.5],[6.2,45.1],[7.5,44.1],[7.3,43.7],[6.2,43.1],[3.1,43.5],[3.1,42.5],[1.8,42.6],[0.8,42.8],[-1.8,43.4],[-1.4,46.2],[-4.5,48.4],[-1.6,48.6],[0.1,49.5],[1.6,50.1],[2.5,51.1],[3.2,50.8],[4.2,49.9],[5.7,49.5],[6.4,49.2],[7.5,49.0],[8.2,49.0],[7.5,47.6],[6.0,47.5],[4.8,46.3]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "DE", "NAME": "ドイツ" }, "geometry": { "type": "Polygon", "coordinates": [[[9.9,54.9],[10.9,54.4],[12.1,54.1],[14.2,53.9],[14.7,52.1],[15.0,51.1],[12.4,50.3],[13.6,48.9],[13.0,48.6],[11.3,47.3],[9.6,47.5],[8.6,47.7],[7.5,47.6],[7.6,48.6],[8.1,49.0],[6.4,49.2],[5.7,49.5],[6.1,50.8],[6.0,51.2],[7.1,53.2],[7.2,53.7],[8.7,53.9],[8.5,54.9],[9.9,54.9]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "AU", "NAME": "オーストラリア" }, "geometry": { "type": "Polygon", "coordinates": [[[142.5,-10.9],[142.9,-15.1],[145.2,-14.9],[151.3,-23.4],[153.6,-28.2],[153.0,-31.6],[149.9,-37.5],[140.9,-38.3],[137.7,-35.1],[135.7,-34.9],[123.9,-33.9],[115.1,-34.3],[113.7,-24.9],[114.2,-21.8],[121.7,-20.9],[123.5,-16.4],[129.0,-14.9],[130.4,-12.2],[135.9,-12.0],[136.9,-15.5],[141.0,-17.5],[142.5,-10.9]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "AE", "NAME": "アラブ首長国連邦" }, "geometry": { "type": "Polygon", "coordinates": [[[51.6,24.2],[52.6,24.2],[54.0,24.1],[55.7,25.8],[56.3,26.0],[56.3,24.5],[55.2,23.0],[51.6,24.2]]] } },
            { "type": "Feature", "properties": { "ISO_A2": "SG", "NAME": "シンガポール" }, "geometry": { "type": "Polygon", "coordinates": [[[103.6,1.25],[104.0,1.25],[104.0,1.45],[103.6,1.45],[103.6,1.25]]] } }
        ];

        // 地球儀の初期化
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png');

        // --- 4. 内蔵データを使用して、国境・TC色分け・ホバーを即時適用 ---
        world
            .polygonsData(embeddedFeatures)
            .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.8)') // 白い国境線
            .polygonCapColor(d => {
                const code2 = d.properties.ISO_A2;
                return tcColors[tcMapping[code2] || 'Unknown'];
            })
            // マウスホバー時のポップアップ（国名・2レター・空港名と3レターコード）
            .polygonLabel(d => {
                const name = d.properties.NAME;
                const code2 = d.properties.ISO_A2;
                
                const localAirports = airportsData.filter(ap => ap.country === code2);
                let airportListHTML = localAirports.length > 0 
                    ? localAirports.map(ap => `• ${ap.name} (${ap.code})`).join('<br>')
                    : '主要空港データなし';

                return `
                    <div class="backdrop">
                        <div class="tt-title">${name} (${code2})</div>
                        <div class="tt-body">
                            <strong>【空港リスト】</strong><br>
                            ${airportListHTML}
                        </div>
                    </div>
                `;
            })
            // ホバー時のハイライト設定
            .onPolygonHover(hoverObj => world
                .polygonCapColor(d => d === hoverObj ? 'rgba(255, 255, 255, 0.5)' : tcColors[tcMapping[d.properties.ISO_A2] || 'Unknown'])
            );

        // --- 5. 空港ピンと3レターコードの表示（重なり防止） ---
        world
            .labelsData(airportsData)
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => d.code) 
            .labelSize(1.8)        
            .labelDotRadius(0.6)   
            .labelColor(() => '#ff4757') // 赤いピン
            .labelsTransitionDuration(0);

        // カメラ位置（日本正面）
        world.pointOfView({ lat: 35, lng: 139, altitude: 2.3 });
    </script>
</body>
</html>
