<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Sphere</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff; /* 背景は白 */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');

        // 1. シーンとカメラの設定
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 200;

        // 2. レンダラーの設定（背景を白に）
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xffffff, 1);
        container.appendChild(renderer.domElement);

        // 3. 球体の作成（光の影響を受けない MeshBasicMaterial を使用）
        const geometry = new THREE.SphereGeometry(70, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x3a86ff }); // ただの青
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // 4. マウスで転がす（回転させる）操作の実装
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            // マウスの移動量に応じて球体を回転
            sphere.rotation.y += deltaMove.x * 0.007;
            sphere.rotation.x += deltaMove.y * 0.007;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 5. 描画ループ
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // 画面サイズ変更への対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
