<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D世界空港地球儀マップ</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030408; /* 宇宙空間 */
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globe-container {
            width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center;
        }
        path, circle, text, svg {
            outline: none !important;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        /* 画面中央上部の国名吹き出し */
        #tooltip {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%); background: rgba(10, 16, 35, 0.95);
            color: #fff; padding: 10px 35px; border-radius: 30px;
            font-size: 18px; font-weight: bold; border: 1px solid #00aaff;
            pointer-events: none; z-index: 1000; display: none;
            box-shadow: 0 4px 25px rgba(0,170,255,0.4); text-align: center;
        }
    </style>
</head>
<body>

    <div id="tooltip"></div>
    <div id="globe-container">
        <svg id="globe"></svg>
    </div>

    <script>
        // --- 📊 全世界の主要空港データ ---
        const airportData = [
            // 🇯🇵 日本の主要空港
            { name: "東京国際空港（羽田）", iata: "HND", country: "JP", lat: 35.549, lon: 139.780 },
            { name: "成田国際空港", iata: "NRT", country: "JP", lat: 35.772, lon: 140.393 },
            { name: "関西国際空港", iata: "KIX", country: "JP", lat: 34.432, lon: 135.230 },
            { name: "新千歳空港", iata: "CTS", country: "JP", lat: 42.775, lon: 141.692 },
            { name: "福岡空港", iata: "FUK", country: "JP", lat: 33.585, lon: 130.450 },
            { name: "那覇空港", iata: "OKA", country: "JP", lat: 26.195, lon: 127.646 },
            
            // 🌎 世界の主要空港
            { name: "仁川国際空港", iata: "ICN", country: "KR", lat: 37.460, lon: 126.440 },
            { name: "台湾桃園国際空港", iata: "TPE", country: "TW", lat: 25.079, lon: 121.234 },
            { name: "北京首都国際空港", iata: "PEK", country: "CN", lat: 40.079, lon: 116.603 },
            { name: "ジョン・F・ケネディ国際空港", iata: "JFK", country: "US", lat: 40.641, lon: -73.778 },
            { name: "ロンドン・ヒースロー空港", iata: "LHR", country: "GB", lat: 51.470, lon: -0.454 },
            { name: "パリ＝シャルル・ド・ゴール空港", iata: "CDG", country: "FR", lat: 49.009, lon: 2.547 },
            { name: "ドバイ国際空港", iata: "DXB", country: "AE", lat: 25.253, lon: 55.364 }
        ];

        // 🔎 【最重要修正】地図データの数値IDから2文字の国コード（空港連動用）へ変換する完全なテーブル
        const idToIso2 = {
            "392": "JP", // 日本
            "410": "KR", // 韓国
            "158": "TW", // 台湾
            "156": "CN", // 中国
            "840": "US", // アメリカ
            "826": "GB", // イギリス
            "250": "FR", // フランス
            "784": "AE"  // アラブ首長国連邦
        };

        const width = window.innerWidth;
        const height = window.innerHeight;
        const sensitivity = 0.15; // 🔄 滑らかで扱いやすいドラッグ回転感度

        const svg = d3.select("#globe")
            .attr("width", width)
            .attr("height", height);

        // 3D地球儀（正射投影法）の設定
        const projection = d3.geoOrthographic()
            .scale(280)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        // 🌊 海の描写（完全に不透明な深海ネイビーで視認性を確保）
        const ocean = svg.append("circle")
            .attr("cx", width / 2)
            .attr("cy", height / 2)
            .attr("r", projection.scale())
            .style("fill", "#0a1128")
            .style("stroke", "none");

        const mapGroup = svg.append("g");  // 陸地レイヤー
        const pinsGroup = svg.append("g"); // 空港レイヤー

        // 🗺️ 世界地図（世界標準のTopoJSON）をロード
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
            .then(function(world) {
                const countries = topojson.feature(world, world.objects.countries).features;

                // 陸地の描写
                mapGroup.selectAll(".country")
                    .data(countries)
                    .enter().append("path")
                    .attr("class", "country")
                    .attr("d", path)
                    // 海と完全に色を切り分けた「ソリッドグレー」
                    .style("fill", "#1f3147")
                    .style("stroke", "#2d4460")
                    .style("stroke-width", "1px")
                    
                    // 🔎 マウスホバーイベント
                    .on("mouseover", function(event, d) {
                        const name = d.properties.name || "不明な国";
                        const countryId = String(d.id); // 地図データ固有の数値ID
                        const iso2 = idToIso2[countryId] || ""; // 2文字コードに変換

                        // ① 国名を上部に表示
                        d3.select("#tooltip")
                            .html(`🌍 ${name} ${iso2 ? '(' + iso2 + ')' : ''}`)
                            .style("display", "block");

                        // ② 国全体を鮮やかなネオンブルーにハイライト
                        d3.select(this).style("fill", "#00aaff");

                        // ③ 空港ピンと名前看板を動的に表示
                        if (iso2) {
                            showAirports(iso2);
                        }
                    })
                    
                    .on("mouseout", function() {
                        d3.select("#tooltip").style("display", "none");
                        d3.select(this).style("fill", "#1f3147"); // 通常の色に戻す
                        pinsGroup.selectAll("*").remove(); // マウスが離れたらピンを消去
                    });

                // 🔄 地球儀を手動でドラッグして回す処理
                svg.call(d3.drag().on("drag", function(event) {
                    const rotate = projection.rotate();
                    projection.rotate([
                        rotate[0] + event.dx * sensitivity,
                        rotate[1] - event.dy * sensitivity
                    ]);
                    refreshAll();
                }));

                // 🖱️ マウスホイールでのズームイン・アウト処理
                svg.call(d3.zoom()
                    .scaleExtent([0.5, 5])
                    .on("zoom", function(event) {
                        projection.scale(280 * event.transform.k);
                        refreshAll();
                    })
                );
            });

        // 画面全体の再描画関数
        function refreshAll() {
            svg.selectAll(".country").attr("d", path);
            ocean.attr("r", projection.scale());
            updatePins();
        }

        // --- ✈️ 空港ピン・名前テキスト表示関数 ---
        function showAirports(countryCode) {
            pinsGroup.selectAll("*").remove();

            const localAirports = airportData.filter(ap => ap.country === countryCode);

            localAirports.forEach(ap => {
                const geoPoint = { "type": "Point", "coordinates": [ap.lon, ap.lat] };
                
                // 空港ピン（ネオンレッド）
                pinsGroup.append("circle")
                    .datum(geoPoint)
                    .attr("class", "airport-pin")
                    .attr("r", 5)
                    .style("fill", "#ff3300")
                    .style("stroke", "#ffffff")
                    .style("stroke-width", "1.5px");

                // 空港名テキスト（オレンジ）
                pinsGroup.append("text")
                    .datum(geoPoint)
                    .attr("class", "airport-text")
                    .text(`✈️ ${ap.name} [${ap.iata}]`)
                    .attr("dx", 10)
                    .attr("dy", 4)
                    .style("fill", "#ffcc00")
                    .style("font-size", "12px")
                    .style("font-weight", "bold")
                    .style("text-shadow", "2px 2px 3px #000");
            });

            updatePins();
        }

        // 回転やズームに合わせて、ピンの位置をリアルタイム計算する関数
        function updatePins() {
            // ピンの位置修正
            pinsGroup.selectAll(".airport-pin")
                .attr("cx", d => projection(d.coordinates)[0])
                .attr("cy", d => projection(d.coordinates)[1])
                .style("display", d => {
                    // 地球の裏側（隠れている側）にあるピンは自動で非表示にする
                    const gpath = d3.geoPath().projection(projection);
                    return gpath(d) ? "inline" : "none";
                });

            // 空港名テキストの位置修正
            pinsGroup.selectAll(".airport-text")
                .attr("x", d => projection(d.coordinates)[0])
                .attr("y", d => projection(d.coordinates)[1])
                .style("display", d => {
                    const gpath = d3.geoPath().projection(projection);
                    return gpath(d) ? "inline" : "none";
                });
        }

        // ウィンドウズサイズが変更されたときの追従
        window.addEventListener("resize", function() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            svg.attr("width", w).attr("height", h);
            projection.translate([w / 2, h / 2]);
            ocean.attr("cx", w / 2).attr("cy", h / 2);
            refreshAll();
        });

    </script>
</body>
</html>
