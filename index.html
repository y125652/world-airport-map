<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe with Cargo Airports</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .info-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            display: none;
            z-index: 10;
            transform: translate(15px, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>

    <div id="info-label" class="info-label"></div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const labelEl = document.getElementById('info-label');
        const RADIUS = 70;

        // 1. シーン・カメラ・レンダラーの設定
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        let currentZoom = 180;
        const MIN_ZOOM = 90;
        const MAX_ZOOM = 300;
        camera.position.z = currentZoom;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xffffff, 1);
        container.appendChild(renderer.domElement);

        const globeGroup = new THREE.Group();

        // 2. 高解像度キャンバステクスチャの生成
        const canvas = document.createElement('canvas');
        canvas.width = 4096;
        canvas.height = 2048;
        const ctx = canvas.getContext('2d');
        const texture = new THREE.CanvasTexture(canvas);

        const globeGeometry = new THREE.SphereGeometry(RADIUS, 64, 64);
        const globeMaterial = new THREE.MeshBasicMaterial({ map: texture });
        const globeMesh = new THREE.Mesh(globeGeometry, globeMaterial);
        globeGroup.add(globeMesh);

        // 【修正】鏡写しを解消した、標準の球体UV展開ルールに完全一致させた2D写像
        function geoToCanvas(lat, lng) {
            const x = ((lng + 180) / 360) * canvas.width;
            const y = ((90 - lat) / 180) * canvas.height;
            return { x, y };
        }

        // 【修正】鏡写しを完全に殺した、本来の地球と同じ3D空間のXYZ配置ロジック
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180); 

            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);
            return new THREE.Vector3(x, y, z);
        }

        const cargoAirports = [
            // アジア・オセアニア
            { name: "成田国際空港 (NRT)", country: "日本", lat: 35.7720, lng: 140.3929 },

            { name: "台湾桃園国際空港 (TPE)", country: "台湾", lat: 25.0797, lng: 121.2342 },
            { name: "シンガポール・チャンギ空港 (SIN)", country: "シンガポール", lat: 1.3502, lng: 103.9893 },
            { name: "スワンナプーム空港 (BKK)", country: "タイ", lat: 13.6900, lng: 100.7501 },
            { name: "クアラルンプール国際空港 (KUL)", country: "マレーシア", lat: 2.7456, lng: 101.7072 },
            { name: "スカルノ・ハッタ国際空港 (CGK)", country: "インドネシア", lat: -6.1256, lng: 106.6558 },
            { name: "ニノイ・アキノ国際空港 (MNL)", country: "フィリピン", lat: 14.5086, lng: 121.0194 },

            { name: "インディラ・ガンディー国際空港 (DEL)", country: "インド", lat: 28.5562, lng: 77.1000 },
            { name: "チャトラパティ・シヴァージー国際空港 (BOM)", country: "インド", lat: 19.0896, lng: 72.8656 },
            { name: "チェンナイ国際空港 (MAA)", country: "インド", lat: 12.9941, lng: 80.1709 },
            { name: "シドニー国際空港 (SYD)", country: "オーストラリア", lat: -33.9461, lng: 151.1772 },
            { name: "メルボルン空港 (MEL)", country: "オーストラリア", lat: -37.6733, lng: 144.8433 },
            { name: "オークランド空港 (AKL)", country: "ニュージーランド", lat: -37.0081, lng: 174.7917 },

            { name: "メンフィス国際空港 (MEM)", country: "アメリカ", lat: 35.0424, lng: -89.9767 },
            { name: "アンカレジ国際空港 (ANC)", country: "アメリカ", lat: 61.1744, lng: -149.9964 },

            { name: "ロサンゼルス国際空港 (LAX)", country: "アメリカ", lat: 33.9416, lng: -118.4085 },
            { name: "ジョン・F・ケネディ国際空港 (JFK)", country: "アメリカ", lat: 40.6413, lng: -73.7781 },
            { name: "シカゴ・オヘア国際空港 (ORD)", country: "アメリカ", lat: 41.9742, lng: -87.9073 },

            { name: "ダラス・フォートワース国際空港 (DFW)", country: "アメリカ", lat: 32.8998, lng: -97.0403 },

            { name: "トロント・ピアソン国際空港 (YYZ)", country: "カナダ", lat: 43.6777, lng: -79.6248 },
            { name: "バンクーバー国際空港 (YVR)", country: "カナダ", lat: 49.1967, lng: -123.1815 },

            { name: "フェリペ・アンヘレス国際空港 (NLU)", country: "メキシコ", lat: 19.7441, lng: -99.0136 },

            // 欧州・中東・アフリカ
            { name: "フランクフルト空港 (FRA)", country: "ドイツ", lat: 50.0379, lng: 8.5622 },
            { name: "パリ・シャルル・ド・ゴール空港 (CDG)", country: "フランス", lat: 49.0097, lng: 2.5479 },
            { name: "ロンドン・ヒースロー空港 (LHR)", country: "イギリス", lat: 51.4700, lng: -0.4543 },
            { name: "ロンドン・スタンステッド空港 (STN)", country: "イギリス", lat: 51.8850, lng: 0.2350 },
            { name: "アムステルダム・スキポール空港 (AMS)", country: "オランダ", lat: 52.3105, lng: 4.7683 },
            { name: "リエージュ空港 (LGG)", country: "ベルギー", lat: 50.6374, lng: 5.4432 },
            { name: "リュブリャナ空港 (LJU)", country: "スロベニア", lat: 46.2237, lng: 14.4576 },
            { name: "ミラノ・マルペンサ空港 (MXP)", country: "イタリア", lat: 45.6300, lng: 8.7231 },
            { name: "マドリード・バラハス空港 (MAD)", country: "スペイン", lat: 40.4839, lng: -3.5679 },
            { name: "ザベンテム空港 (BRU)", country: "ベルギー", lat: 50.9014, lng: 4.4844 },
            { name: "ルクセンブルク・フィンデル空港 (LUX)", country: "ルクセンブルク", lat: 49.6233, lng: 6.2044 },
            { name: "チューリッヒ空港 (ZRH)", country: "スイス", lat: 47.4582, lng: 8.5481 },
            { name: "イスタンブール空港 (IST)", country: "トルコ", lat: 41.2753, lng: 28.7519 },
            { name: "ドバイ国際空港 (DXB)", country: "アラブ首長国連邦", lat: 25.2532, lng: 55.3657 },
            { name: "アール・マクトゥーム国際空港 (DWC)", country: "アラブ首長国連邦", lat: 24.8961, lng: 55.1614 },
            { name: "カタール・ハマド国際空港 (DOH)", country: "カタール", lat: 25.2611, lng: 51.5651 },
            { name: "キング・ファハド国際空港 (DMM)", country: "サウジアラビア", lat: 26.4712, lng: 49.7979 },
            { name: "ベングリオン国際空港 (TLV)", country: "イスラエル", lat: 32.0056, lng: 34.8854 },
            { name: "カイロ国際空港 (CAI)", country: "エジプト", lat: 30.1219, lng: 31.4056 },
            { name: "ジョモ・ケニヤッタ国際空港 (NBO)", country: "ケニア", lat: -1.3192, lng: 36.9275 },
            { name: "O・R・タンボ国際空港 (JNB)", country: "南アフリカ", lat: -26.1367, lng: 28.2460 },
            { name: "ムルタラ・モハンマド国際空港 (LOS)", country: "ナイジェリア", lat: 6.5774, lng: 3.3210 },
            { name: "ボレ国際空港 (ADD)", country: "エチオピア", lat: 8.9779, lng: 38.7993 },

            // 中南米
            { name: "グアルーリョス国際空港 (GRU)", country: "ブラジル", lat: -23.4356, lng: -46.4731 },
            { name: "ヴィラコッポス国際空港 (VCP)", country: "ブラジル", lat: -23.0074, lng: -47.1344 },
            { name: "ミニストロ・ピスタリーニ国際空港 (EZE)", country: "アルゼンチン", lat: -34.8222, lng: -58.5358 },
            { name: "エルドラド国際空港 (BOG)", country: "コロンビア", lat: 4.7017, lng: -74.1469 },
            { name: "アルトゥーロ・メリノ・ベニテス国際空港 (SCL)", country: "チリ", lat: -33.3930, lng: -70.7858 },
            { name: "ホルヘ・チャベス国際空港 (LIM)", country: "ペルー", lat: -12.0219, lng: -77.1143 },
            { name: "トクメン国際空港 (PTY)", country: "パナマ", lat: 9.0714, lng: -79.3835 },
            { name: "フアン・サンタマリア国際空港 (SJO)", country: "コスタリカ", lat: 9.9939, lng: -84.2089 },
            { name: "ララ・エレーラ国際空港 (UIO)", country: "エクアドル", lat: -0.1228, lng: -78.3575 }
        ];

        function isPointInPolygon(lat, lng, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i][0], yi = polygon[i][1];
                const xj = polygon[j][0], yj = polygon[j][1];
                const intersect = ((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        let geoJsonData = null;
        let hoveredCountryName = "";

        // 3. 地図描画関数
        function drawMap(targetCountryName = "") {
            if (!geoJsonData) return;

            // 海の色
            ctx.fillStyle = '#051026';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            geoJsonData.features.forEach(feature => {
                const type = feature.geometry.type;
                const coordinates = feature.geometry.coordinates;
                const countryName = feature.properties.NAME_JA || feature.properties.NAME || "Unknown";

                if (countryName === targetCountryName) {
                    ctx.fillStyle = '#1e90ff';  // ホバー：鮮やかな青
                } else {
                    ctx.fillStyle = '#dcdcdc';  // 陸地：明るいグレー
                }
                ctx.strokeStyle = '#556688'; // 国境線
                ctx.lineWidth = 1.5;

                if (type === 'Polygon') {
                    renderPolygon(coordinates);
                } else if (type === 'MultiPolygon') {
                    coordinates.forEach(polygon => renderPolygon(polygon));
                }
            });

            texture.needsUpdate = true;
        }

        function renderPolygon(polygon) {
            ctx.beginPath();
            polygon.forEach(ring => {
                ring.forEach((coord, i) => {
                    const pos = geoToCanvas(coord[1], coord[0]);
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });
            });
            ctx.fill();
            ctx.stroke();
        }

        // 国境データのロード
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(json => {
                geoJsonData = json;
                drawMap();
                createAirportPins();
            });

        // 4. 空港ピンの配置処理
        const pins = [];
        const pinGeometry = new THREE.SphereGeometry(1.0, 16, 16);
        const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xff3366 });

        function createAirportPins() {
            cargoAirports.forEach(airport => {
                const pin = new THREE.Mesh(pinGeometry, pinMaterial);
                const pos = latLngToVector3(airport.lat, airport.lng, RADIUS + 0.3);
                pin.position.copy(pos);
                pin.userData = { type: 'airport', name: airport.name, country: airport.country };
                globeGroup.add(pin);
                pins.push(pin);
            });
        }

        scene.add(globeGroup);
        // 日本付近が初期正面を向くように設定（反転解消に伴いリセット）
        globeGroup.rotation.y = -2.5; 

        // 5. マウス操作・ドラッグ・ズーム・ホバー処理
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const airportIntersects = raycaster.intersectObjects(pins);
            
            if (airportIntersects.length > 0) {
                const data = airportIntersects[0].object.userData;
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${data.name}</strong><br><small>国: ${data.country}</small>`;
                document.body.style.cursor = 'pointer';
            } else {
                const globeIntersects = raycaster.intersectObject(globeMesh);
                
                if (globeIntersects.length > 0 && geoJsonData) {
                    const hitPoint = globeIntersects[0].point;
                    const localPoint = hitPoint.clone().applyMatrix4(globeGroup.matrixWorld.invert());
                    
                    // 【修正】3D空間のXYZから、正しい球体UV展開ルールに基づきLat/Lng（経緯度）を逆算（反転の完全除去）
                    const rad = Math.sqrt(localPoint.x * localPoint.x + localPoint.y * localPoint.y + localPoint.z * localPoint.z);
                    const lat = 90 - Math.acos(localPoint.y / rad) * (180 / Math.PI);
                    
                    // 標準展開数式に対応した正しい経度の抽出
                    let lng = Math.atan2(-localPoint.x, localPoint.z) * (180 / Math.PI) - 180;
                    while (lng > 180) lng -= 360;
                    while (lng < -180) lng += 360;

                    let foundCountry = null;
                    for (let c = 0; c < geoJsonData.features.length; c++) {
                        const feat = geoJsonData.features[c];
                        if (feat.geometry.type === 'Polygon') {
                            if (isPointInPolygon(lat, lng, feat.geometry.coordinates[0])) { foundCountry = feat; break; }
                        } else {
                            for (let p = 0; p < feat.geometry.coordinates.length; p++) {
                                if (isPointInPolygon(lat, lng, feat.geometry.coordinates[p][0])) { foundCountry = feat; break; }
                            }
                        }
                    }

                    if (foundCountry) {
                        const name = foundCountry.properties.NAME_JA || foundCountry.properties.NAME || "Unknown";
                        const iso2 = foundCountry.properties.ISO_A2 || foundCountry.properties.iso_a2 || "??";
                        
                        labelEl.style.display = 'block';
                        labelEl.style.left = `${e.clientX}px`;
                        labelEl.style.top = `${e.clientY}px`;
                        labelEl.innerHTML = `<strong>${name}</strong> (${iso2})`;
                        document.body.style.cursor = 'default';

                        if (hoveredCountryName !== name) {
                            hoveredCountryName = name;
                            drawMap(name);
                        }
                    } else {
                        labelEl.style.display = 'none';
                        document.body.style.cursor = 'default';
                        if (hoveredCountryName !== "") {
                            hoveredCountryName = "";
                            drawMap();
                        }
                    }
                } else {
                    labelEl.style.display = 'none';
                    document.body.style.cursor = 'default';
                    if (hoveredCountryName !== "") {
                        hoveredCountryName = "";
                        drawMap();
                    }
                }
            }

            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            globeGroup.rotation.y += deltaMove.x * 0.005;
            globeGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('wheel', (e) => {
            currentZoom += e.deltaY * 0.1;
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
            camera.position.z = currentZoom;
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
