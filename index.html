<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://unpkg.com/globe.gl@2.26.0/dist/globe.gl.min.js"></script>
</head>
<body>

    <div id="globeViz"></div>

    <script>
        const myGlobe = Globe()(document.getElementById('globeViz'))
            .backgroundColor('#000000')   // 宇宙（背景）の色
            .showAtmosphere(true)         // 大気圏エフェクト
            .atmosphereColor('#3a86ff')   // 大気圏の色
            
            // 地球の表面に経緯度線を引いて立体感と地球儀感を出す
            .labelsData([{ lat: 0, lng: 0, text: '' }]) // ライトを強制アクティブにするためのダミーデータ
            .globeColor('#050b14') // 球体のベース色（海）
            
            // 地球儀のワイヤーフレーム（経緯度線）を設定
            .hexPolygonsData([
                { geometry: { type: "Polygon", coordinates: [[[-180, 90], [180, 90], [180, -90], [-180, -90], [-180, 90]]] } }
            ])
            .hexPolygonColor(() => 'rgba(58, 134, 255, 0.15)') // 線の色
            .hexPolygonResolution(3); // グリッドの細かさ

        // カメラの初期距離
        myGlobe.pointOfView({ alt: 2.5 });
    </script>
</body>
</html>
