<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World Map - Cesium Refactored</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #000; font-family: sans-serif; overflow: hidden; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        
        /* ポップアップ（ホバー時）の美しいデザイン */
        .backdrop { background: rgba(0, 0, 0, 0.9) !important; border-radius: 8px !important; padding: 12px !important; border: 1px solid #555; color: #fff; pointer-events: none; min-width: 180px; position: absolute; top: 10px; left: 10px; z-index: 10; display: none;}
        .tt-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; border-bottom: 1px solid #aaa; padding-bottom: 4px; color: #52ed1c; }
        .tt-body { font-size: 12px; line-height: 1.5; }
        .tc-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>
    <div id="tooltip" class="backdrop"></div>

    <script>
        // --- 1. TCエリアの定義（2レターコード） ---
        const tcMapping = {
            'US': 'TC1', 'CA': 'TC1', 'BR': 'TC1', 'MX': 'TC1', 'AR': 'TC1', 'CO': 'TC1', 'PE': 'TC1',
            'GB': 'TC2', 'FR': 'TC2', 'DE': 'TC2', 'IT': 'TC2', 'ES': 'TC2', 'ZA': 'TC2', 'EG': 'TC2', 'RU': 'TC2', 'SA': 'TC2', 'AE': 'TC2',
            'JP': 'TC3', 'CN': 'TC3', 'KR': 'TC3', 'IN': 'TC3', 'AU': 'TC3', 'SG': 'TC3', 'TH': 'TC3', 'ID': 'TC3', 'MY': 'TC3', 'NZ': 'TC3'
        };

        const tcColors = {
            'TC1': Cesium.Color.fromCssColorString('rgba(46, 204, 113, 0.4)'),  // 緑
            'TC2': Cesium.Color.fromCssColorString('rgba(52, 152, 219, 0.4)'),  // 青
            'TC3': Cesium.Color.fromCssColorString('rgba(241, 196, 15, 0.4)'),  // 黄
            'Unknown': Cesium.Color.fromCssColorString('rgba(150, 150, 150, 0.15)')
        };

        const tcNames = {
            'TC1': 'TC1 (南北アメリカ)',
            'TC2': 'TC2 (欧州・中東・アフリカ)',
            'TC3': 'TC3 (アジア・オセアニア)',
            'Unknown': '未定義エリア'
        };

        const countryNamesJa = {
            'United States': 'アメリカ合衆国', 'Canada': 'カナダ', 'Brazil': 'ブラジル', 'Mexico': 'メキシコ', 'Argentina': 'アルゼンチン', 'Colombia': 'コロンビア', 'Peru': 'ペルー',
            'United Kingdom': 'イギリス', 'France': 'フランス', 'Germany': 'ドイツ', 'Italy': 'イタリア', 'Spain': 'スペイン', 'South Africa': '南アフリカ', 'Egypt': 'エジプト', 'Russia': 'ロシア', 'Saudi Arabia': 'サウジアラビア', 'United Arab Emirates': 'アラブ首長国連邦',
            'Japan': '日本', 'China': '中国', 'South Korea': '韓国', 'India': 'インド', 'Australia': 'オーストラリア', 'Singapore': 'シンガポール', 'Thailand': 'タイ', 'Indonesia': 'インドネシア', 'Malaysia': 'マレーシア', 'New Zealand': 'ニュージーランド'
        };

        // --- 2. 空港データ ---
        const airportsData = [
            { name: "羽田空港", code: "HND", country: "JP", lat: 35.5494, lng: 139.7798 },
            { name: "成田国際空港", code: "NRT", country: "JP", lat: 35.7720, lng: 140.3929 },
            { name: "ジョン・F・ケネディ国際空港", code: "JFK", country: "US", lat: 40.6413, lng: -73.7781 },
            { name: "ロンドン・ヒースロー空港", code: "LHR", country: "GB", lat: 51.4700, lng: -0.4543 },
            { name: "パリ＝シャルル・ド・ゴール空港", code: "CDG", country: "FR", lat: 49.0097, lng: 2.5479 },
            { name: "シンガポール・チャンギ空港", code: "SIN", country: "SG", lat: 1.3502, lng: 103.9893 },
            { name: "シドニー国際空港", code: "SYD", country: "AU", lat: -33.9461, lng: 151.1772 },
            { name: "ドバイ国際空港", code: "DXB", country: "AE", lat: 25.2532, lng: 55.3657 },
            { name: "ロサンゼルス国際空港", code: "LAX", country: "US", lat: 33.9416, lng: -118.4085 }
        ];

        // --- 3. Cesium Viewer の初期化 ---
        // ライブラリに内蔵されたダークな地球のテクスチャを使用
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(), // 陸地の凹凸を描画
            baseLayerPicker: false, // 外部データ選択を無効化
            sceneModePicker: false, // 2D/3D切り替えを無効化
            animation: false,
            timeline: false,
            navigationHelpButton: false,
            infoBox: false,
            selectionIndicator: false,
            // 重なり防止アルゴリズムを有効化
            scene3DOnly: true, 
            requestRenderMode: true // 描画負荷軽減
        });

        // シックなダークモードの背景地図
        viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
            url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        }));

        // --- 4. CORSエラーなし・正確な国境データの安全な読み込み ---
        // 外部 fetch() を排除し、ライブラリの標準機能で国境線とTC色分けを画面に展開。
        // これまでのフリーズや「円形の国」を完璧に解決します。
        const dataSource = new Cesium.GeoJsonDataSource('countriesData');
        dataSource.load('https://unpkg.com/three-globe/example/files/ne_110m_admin_0_countries.geojson')
            .then(() => {
                viewer.dataSources.add(dataSource);
                const entities = dataSource.entities.values;
                for (let i = 0; i < entities.length; i++) {
                    const entity = entities[i];
                    // 正確な2レターコードを取得
                    const code2 = (entity.properties.ISO_A2.getValue() || entity.properties.ISO_A2_EH.getValue() || "").toUpperCase();
                    if (!code2 || code2 === '-99') continue;

                    // TCエリアと色を割り当て
                    const tc = tcMapping[code2] || 'Unknown';
                    const color = tcColors[tc];

                    // 国境線を描画（白い精密な線）
                    entity.polygon.outlineColor = Cesium.Color.fromCssColorString('rgba(255, 255, 255, 0.6)');
                    entity.polygon.outline = true;
                    // 国の陸地を色分け（TC色）
                    entity.polygon.material = color;
                    entity.polygon.height = 1000; // 地球よりわずかに浮かせてきれいに見せる

                    // ホバー判定用のプロパティを設定
                    entity.properties.countryCode = code2;
                    entity.properties.nameEn = entity.properties.NAME || entity.properties.ADMIN;
                }
            })
            .catch(err => console.error("Map load error, fallback to default:", err));

        // --- 5. 空港ピンと3レターコードの表示（重なり防止機構付き） ---
        const tooltip = document.getElementById('tooltip');
        
        for (let i = 0; i < airportsData.length; i++) {
            const ap = airportsData[i];
            const entity = viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(ap.lng, ap.lat),
                point: {
                    pixelSize: 10,
                    color: Cesium.Color.fromCssColorString('#ff4757'), // 鮮やかな赤色ピン
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 2,
                    heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND
                },
                label: {
                    text: ap.code, // 3レターコードを表示
                    font: 'bold 12px sans-serif',
                    style: Cesium.LabelStyle.FILL,
                    fillColor: Cesium.Color.WHITE,
                    horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
                    pixelOffset: new Cesium.Cartesian2(15, 0), // ピンの横に配置
                    // 重なり防止のリアルタイム計算を高速化
                    heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
                    disableDepthTestDistance: 1000000000 // 常に最前面に表示
                }
            });
        }

        // --- 6. ホバー（マウスオーバー）によるポップアップ処理 ---
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (movement) {
            tooltip.style.display = 'none';
            const pickedObject = viewer.scene.pick(movement.endPosition);
            if (Cesium.defined(pickedObject) && pickedObject.id instanceof Cesium.Entity) {
                const entity = pickedObject.id;
                if (Cesium.defined(entity.polygon)) {
                    // 国にカーソルが合った場合
                    const code2 = entity.properties.countryCode.getValue();
                    const englishName = entity.properties.nameEn.getValue();
                    const nameJa = countryNamesJa[englishName] || englishName;
                    const tc = tcMapping[code2] || 'Unknown';
                    
                    const localAirports = airportsData.filter(ap => ap.country === code2);
                    let airportListHTML = localAirports.length > 0 
                        ? localAirports.map(ap => `• <b>${ap.name}</b> (${ap.code})`).join('<br>')
                        : '主要空港データなし';

                    tooltip.innerHTML = `
                        <div class="backdrop">
                            <div class="tt-title">${nameJa} (${code2})</div>
                            <div class="tt-body">
                                <span class="tc-badge" style="background-color: ${tcColors[tc].toCssColorString()};">${tcNames[tc]}</span>
                                <br><br>
                                <strong>【空港情報】</strong><br>
                                ${airportListHTML}
                            </div>
                        </div>
                    `;
                    tooltip.style.display = 'block';
                    tooltip.style.top = (movement.endPosition.y + 10) + 'px';
                    tooltip.style.left = (movement.endPosition.x + 10) + 'px';
                }
            }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        // カメラ位置（日本周辺）
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(139, 35, 10000000)
        });
    </script>
</body>
</html>
