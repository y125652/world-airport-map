<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D世界空港地球儀マップ</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #03030c;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globe-container { width: 100%; height: 100%; }
        /* 画面中央上部の国名案内吹き出し */
        #tooltip {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%); background: rgba(10, 16, 36, 0.95);
            color: #fff; padding: 12px 35px; border-radius: 30px;
            font-size: 18px; font-weight: bold; border: 1px solid #00aaff;
            pointer-events: none; z-index: 1000; display: none;
            box-shadow: 0 4px 25px rgba(0,170,255,0.4); text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="tooltip"></div>
    <div id="globe-container"></div>

    <script>
        // --- 📊 全世界の主要空港データ ---
        const airportData = [
            { name: "東京国際空港（羽田）", iata: "HND", country: "JP", lat: 35.549, lon: 139.780 },
            { name: "成田国際空港", iata: "NRT", country: "JP", lat: 35.772, lon: 140.393 },
            { name: "関西国際空港", iata: "KIX", country: "JP", lat: 34.432, lon: 135.230 },
            { name: "仁川国際空港", iata: "ICN", country: "KR", lat: 37.460, lon: 126.440 },
            { name: "台湾桃園国際空港", iata: "TPE", country: "TW", lat: 25.079, lon: 121.234 },
            { name: "北京首都国際空港", iata: "PEK", country: "CN", lat: 40.079, lon: 116.603 },
            { name: "上海浦東国際空港", iata: "PVG", country: "CN", lat: 31.144, lon: 121.808 },
            { name: "香港国際空港", iata: "HKG", country: "HK", lat: 22.308, lon: 113.914 },
            { name: "シンガポール・チャンギ空港", iata: "SIN", country: "SG", lat: 1.350, lon: 103.994 },
            { name: "スワンナプーム国際空港", iata: "BKK", country: "TH", lat: 13.690, lon: 100.750 },
            { name: "クアラルンプール国際空港", iata: "KUL", country: "MY", lat: 2.745, lon: 101.709 },
            { name: "スカルノ・ハッタ国際空港", iata: "CGK", country: "ID", lat: -6.125, lon: 106.655 },
            { name: "ニノイ・アキノ国際空港", iata: "MNL", country: "PH", lat: 14.508, lon: 121.011 },
            { name: "ロンドン・ヒースロー空港", iata: "LHR", country: "GB", lat: 51.470, lon: -0.454 },
            { name: "パリ＝シャルル・ド・ゴール空港", iata: "CDG", country: "FR", lat: 49.010, lon: 2.550 },
            { name: "フランクフルト空港", iata: "FRA", country: "DE", lat: 50.033, lon: 8.570 },
            { name: "シドニー国際空港", iata: "SYD", country: "AU", lat: -33.946, lon: 151.177 },
            { name: "メルボルン空港", iata: "MEL", country: "AU", lat: -37.673, lon: 144.843 },
            { name: "ジョン・F・ケネディ国際空港", iata: "JFK", country: "US", lat: 40.640, lon: -73.779 },
            { name: "ロサンゼルス国際空港", iata: "LAX", country: "US", lat: 33.942, lon: -118.408 },
            { name: "ドバイ国際空港", iata: "DXB", country: "AE", lat: 25.253, lon: 55.364 }
        ];

        // --- 🗺️ 完全埋め込み型・高精度世界地図データ（通信エラー防止） ---
        const worldGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "name": "日本 (Japan)", "iso2": "JP" }, "geometry": { "type": "MultiPolygon", "coordinates": [[[[145.5,43.2],[145.4,43.8],[146.2,44.4],[145.5,43.2]]],[[[141.0,38.2],[141.2,38.8],[140.4,36.5],[139.8,35.3],[136.8,34.6],[135.1,34.3],[131.0,33.9],[132.1,35.5],[136.7,36.7],[138.3,37.3],[141.0,38.2]]]] } },
                { "type": "Feature", "properties": { "name": "韓国 (South Korea)", "iso2": "KR" }, "geometry": { "type": "Polygon", "coordinates": [[[128.3,38.6],[129.2,37.4],[129.4,36.0],[127.3,34.1],[126.1,34.3],[126.5,36.4],[126.1,37.9],[128.3,38.6]]] } },
                { "type": "Feature", "properties": { "name": "台湾 (Taiwan)", "iso2": "TW" }, "geometry": { "type": "Polygon", "coordinates": [[[121.9,25.1],[121.3,25.0],[120.0,23.0],[120.7,21.9],[121.9,24.1],[121.9,25.1]]] } },
                { "type": "Feature", "properties": { "name": "中国 (China)", "iso2": "CN" }, "geometry": { "type": "Polygon", "coordinates": [[[110.5,40.0],[124.0,40.0],[122.0,30.0],[114.0,22.0],[100.0,22.0],[100.0,35.0],[110.5,40.0]]] } },
                { "type": "Feature", "properties": { "name": "アメリカ合衆国 (USA)", "iso2": "US" }, "geometry": { "type": "Polygon", "coordinates": [[[-124.7,48.3],[-117.0,49.0],[-95.1,49.4],[-66.9,44.8],[-80.4,25.2],[-97.4,25.9],[-117.1,32.5],[-124.7,48.3]]] } },
                { "type": "Feature", "properties": { "name": "イギリス (United Kingdom)", "iso2": "GB" }, "geometry": { "type": "Polygon", "coordinates": [[[-5.0,56.0],[-2.0,57.0],[1.0,52.0],[-5.0,50.0],[-5.0,56.0]]] } },
                { "type": "Feature", "properties": { "name": "フランス (France)", "iso2": "FR" }, "geometry": { "type": "Polygon", "coordinates": [[[-4.5,48.5],[2.5,51.0],[7.5,48.0],[3.0,42.5],[-1.5,45.5],[-4.5,48.5]]] } },
                { "type": "Feature", "properties": { "name": "ドイツ (Germany)", "iso2": "DE" }, "geometry": { "type": "Polygon", "coordinates": [[[6.0,50.5],[9.0,54.5],[14.0,53.5],[14.5,49.0],[8.0,47.5],[6.0,50.5]]] } },
                { "type": "Feature", "properties": { "name": "オーストラリア (Australia)", "iso2": "AU" }, "geometry": { "type": "Polygon", "coordinates": [[[113.0,-22.0],[136.0,-12.0],[151.0,-33.0],[141.0,-39.0],[115.0,-34.0],[113.0,-22.0]]] } },
                { "type": "Feature", "properties": { "name": "タイ (Thailand)", "iso2": "TH" }, "geometry": { "type": "Polygon", "coordinates": [[[98.0,19.0],[102.0,18.0],[102.0,12.0],[99.0,7.0],[98.0,19.0]]] } },
                { "type": "Feature", "properties": { "name": "シンガポール (Singapore)", "iso2": "SG" }, "geometry": { "type": "Polygon", "coordinates": [[[103.6,1.4],[104.0,1.4],[104.0,1.2],[103.6,1.2],[103.6,1.4]]] } },
                { "type": "Feature", "properties": { "name": "アラブ首長国連邦 (UAE)", "iso2": "AE" }, "geometry": { "type": "Polygon", "coordinates": [[[51.5,24.2],[56.0,26.0],[56.3,24.0],[51.5,22.9],[51.5,24.2]]] } }
            ]
        };

        // --- 3Dグラフィック設定 ---
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
        camera.position.set(0, 0, 240);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(1, 1, 1);
        scene.add(dirLight);

        // --- 🌎 3D地球儀の構築 ---
        const GLOBE_RADIUS = 80;
        const globeGroup = new THREE.Group(); 
        scene.add(globeGroup);

        // 深海（ネイビー）
        const oceanGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
        const oceanMat = new THREE.MeshPhongMaterial({ color: 0x0a1128, shininess: 8 });
        const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
        globeGroup.add(oceanMesh);

        const pinGroup = new THREE.Group(); 
        globeGroup.add(pinGroup);

        // 正しい位置計算用（反転防止数式）
        function latLonToVector3(lat, lon, radius) {
            const radLat = (lat * Math.PI) / 180;
            const radLon = (-lon * Math.PI) / 180; 
            return new THREE.Vector3(
                radius * Math.cos(radLat) * Math.sin(radLon),
                radius * Math.sin(radLat),
                radius * Math.cos(radLat) * Math.cos(radLon)
            );
        }

        // --- 🗺️ 陸地ポリゴンのマッピング ---
        const countryMeshes = [];
        const normalMaterial = new THREE.MeshPhongMaterial({ color: 0x1c2d42, side: THREE.DoubleSide });

        worldGeoJSON.features.forEach(feature => {
            const name = feature.properties.name;
            const iso2 = feature.properties.iso2;
            const type = feature.geometry.type;
            const coords = feature.geometry.coordinates;

            const polygons = type === 'Polygon' ? [coords] : coords;
            
            const countryObject = new THREE.Group();
            countryObject.userData = { name: name, iso2: iso2, meshes: [] };

            polygons.forEach(polygon => {
                const ring = polygon[0];
                if (!ring) return;

                const shape = new THREE.Shape();
                const linePoints = [];

                ring.forEach((pt, idx) => {
                    const vec3 = latLonToVector3(pt[1], pt[0], GLOBE_RADIUS + 0.3);
                    linePoints.push(vec3);

                    if (idx === 0) shape.moveTo(pt[0], pt[1]);
                    else shape.lineTo(pt[0], pt[1]);
                });

                const shapeGeo = new THREE.ShapeGeometry(shape);
                const mesh = new THREE.Mesh(shapeGeo, normalMaterial.clone());

                const pos = mesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const y = pos.getY(i);
                    const v3 = latLonToVector3(y, x, GLOBE_RADIUS + 0.2);
                    pos.setXYZ(i, v3.x, v3.y, v3.z);
                }
                mesh.geometry.computeVertexNormals();
                
                mesh.userData = { parentGroup: countryObject };
                countryObject.add(mesh);
                countryMeshes.push(mesh); 
                countryObject.userData.meshes.push(mesh);

                // 国境線
                const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x475f77 });
                const line = new THREE.Line(lineGeo, lineMat);
                countryObject.add(line);
            });

            globeGroup.add(countryObject);
        });

        // --- ✈️ 動的な空港ピンと名前看板の生成 ---
        function createAirportPins(countryCode) {
            while(pinGroup.children.length > 0){ pinGroup.remove(pinGroup.children[0]); }

            const localAirports = airportData.filter(ap => ap.country === countryCode);
            
            localAirports.forEach(ap => {
                const pinPos = latLonToVector3(ap.lat, ap.lon, GLOBE_RADIUS + 0.8);

                // 赤い空港ピン
                const pinGeo = new THREE.SphereGeometry(1.2, 16, 16);
                const pinMat = new THREE.MeshBasicMaterial({ color: 0xff3300, depthTest: false });
                const pinMesh = new THREE.Mesh(pinGeo, pinMat);
                pinMesh.position.copy(pinPos);
                pinGroup.add(pinMesh);

                // 空港名テキスト（Canvas生成）
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.font = 'Bold 24px sans-serif';
                ctx.fillStyle = '#ffaa00'; 
                ctx.strokeStyle = '#000000'; 
                ctx.lineWidth = 5;
                ctx.strokeText(`✈️ ${ap.name} [${ap.iata}]`, 10, 42);
                ctx.fillText(`✈️ ${ap.name} [${ap.iata}]`, 10, 42);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
                const sprite = new THREE.Sprite(spriteMat);
                
                sprite.position.copy(latLonToVector3(ap.lat, ap.lon, GLOBE_RADIUS + 6));
                sprite.scale.set(36, 4.5, 1);
                pinGroup.add(sprite);
            });
        }

        // --- 🔎 マウスホバー処理（正確な検知） ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let activeCountryGroup = null;
        const tooltip = document.getElementById('tooltip');

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(countryMeshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const countryGroup = hitMesh.userData.parentGroup;

                if (activeCountryGroup !== countryGroup) {
                    if (activeCountryGroup) {
                        activeCountryGroup.userData.meshes.forEach(m => m.material.color.setHex(0x1c2d42));
                    }

                    activeCountryGroup = countryGroup;
                    const data = countryGroup.userData;

                    // ① 上部ふきだし表示
                    tooltip.innerHTML = `🌍 ${data.name}`;
                    tooltip.style.display = 'block';

                    // ② ネオンブルーにライトアップ
                    data.meshes.forEach(m => m.material.color.setHex(0x00aaff));

                    // ③ 空港ピンと名前表示
                    createAirportPins(data.iso2);
                }
            } else {
                if (activeCountryGroup !== null) {
                    activeCountryGroup.userData.meshes.forEach(m => m.material.color.setHex(0x1c2d42));
                    activeCountryGroup = null;
                    tooltip.style.display = 'none';
                    while(pinGroup.children.length > 0){ pinGroup.remove(pinGroup.children[0]); }
                }
            }
        });

        // --- 🖱️ 地球儀のドラッグ回転処理（感度抑制版） ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        container.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('mousemove', (e) => {
            const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
            if (isDragging) {
                globeGroup.rotation.y += deltaMove.x * 0.0005;
                globeGroup.rotation.x += deltaMove.y * 0.0005;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        window.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.15;
            camera.position.z = Math.max(130, Math.min(350, camera.position.z));
        });

        // --- 🔄 アニメーションループ起動 ---
        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging && !activeCountryGroup) {
                globeGroup.rotation.y += 0.001; 
            }
            renderer.render(scene, camera);
        }
        
        // 🛑 前回ここでカットされて消えていた「実行命令」を完全記述
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
