<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界主要空港マップ</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <style>
        html, body, #map {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050b14; /* 宇宙・深海をイメージした背景 */
        }
        /* 空港名の吹き出し（ラベル）のデザイン */
        .airport-label {
            background: rgba(20, 30, 55, 0.95);
            border: 1px solid #00aaff;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // --- 📊 全世界（約200カ国・地域）の主要国際空港データ ---
        const airportData = [
            // アジアーーー
            { name: "東京国際空港（羽田）", iata_code: "HND", iso_country: "JP", latitude: 35.549, longitude: 139.780 },
            { name: "成田国際空港", iata_code: "NRT", iso_country: "JP", latitude: 35.772, longitude: 140.393 },
            { name: "関西国際空港", iata_code: "KIX", iso_country: "JP", latitude: 34.432, longitude: 135.230 },
            { name: "仁川国際空港", iata_code: "ICN", iso_country: "KR", latitude: 37.460, longitude: 126.440 },
            { name: "台湾桃園国際空港", iata_code: "TPE", iso_country: "TW", latitude: 25.079, longitude: 121.234 },
            { name: "北京首都国際空港", iata_code: "PEK", iso_country: "CN", latitude: 40.079, longitude: 116.603 },
            { name: "上海浦東国際空港", iata_code: "PVG", iso_country: "CN", latitude: 31.144, longitude: 121.808 },
            { name: "香港国際空港", iata_code: "HKG", iso_country: "HK", latitude: 22.308, longitude: 113.914 },
            { name: "シンガポール・チャンギ空港", iata_code: "SIN", iso_country: "SG", latitude: 1.350, longitude: 103.994 },
            { name: "スワンナプーム国際空港", iata_code: "BKK", iso_country: "TH", latitude: 13.690, longitude: 100.750 },
            { name: "クアラルンプール国際空港", iata_code: "KUL", iso_country: "MY", latitude: 2.745, longitude: 101.709 },
            { name: "スカルノ・ハッタ国際空港", iata_code: "CGK", iso_country: "ID", latitude: -6.125, longitude: 106.655 },
            { name: "ニノイ・アキノ国際空港", iata_code: "MNL", iso_country: "PH", latitude: 14.508, longitude: 121.011 },
            { name: "ノイバイ国際空港", iata_code: "HAN", iso_country: "VN", latitude: 21.221, longitude: 105.807 },
            { name: "インディラ・ガンディー国際空港", iata_code: "DEL", iso_country: "IN", latitude: 28.566, longitude: 77.103 },
            // オセアニアーーー
            { name: "シドニー国際空港", iata_code: "SYD", iso_country: "AU", latitude: -33.946, longitude: 151.177 },
            { name: "メルボルン空港", iata_code: "MEL", iso_country: "AU", latitude: -37.673, longitude: 144.843 },
            { name: "オークランド空港", iata_code: "AKL", iso_country: "NZ", latitude: -37.008, longitude: 174.791 },
            // 北米・中南米ーーー
            { name: "ジョン・F・ケネディ国際空港", iata_code: "JFK", iso_country: "US", latitude: 40.640, longitude: -73.779 },
            { name: "ロサンゼルス国際空港", iata_code: "LAX", iso_country: "US", latitude: 33.942, longitude: -118.408 },
            { name: "シカゴ・オヘア国際空港", iata_code: "ORD", iso_country: "US", latitude: 41.974, longitude: -87.907 },
            { name: "サンフランシスコ国際空港", iata_code: "SFO", iso_country: "US", latitude: 37.619, longitude: -122.375 },
            { name: "トロント・ピアソン国際空港", iata_code: "YYZ", iso_country: "CA", latitude: 43.677, longitude: -79.624 },
            { name: "バンクーバー国際空港", iata_code: "YVR", iso_country: "CA", latitude: 49.193, longitude: -123.184 },
            { name: "メキシコシティ国際空港", iata_code: "MEX", iso_country: "MX", latitude: 19.436, longitude: -99.072 },
            { name: "グアルーリョス国際空港", iata_code: "GRU", iso_country: "BR", latitude: -23.435, longitude: -46.473 },
            { name: "ミニストロ・ピスタリーニ国際空港", iata_code: "EZE", iso_country: "AR", latitude: -34.822, longitude: -58.535 },
            // ヨーロッパーーー
            { name: "ロンドン・ヒースロー空港", iata_code: "LHR", iso_country: "GB", latitude: 51.470, longitude: -0.454 },
            { name: "パリ＝シャルル・ド・ゴール空港", iata_code: "CDG", iso_country: "FR", latitude: 49.010, longitude: 2.550 },
            { name: "フランクフルト空港", iata_code: "FRA", iso_country: "DE", latitude: 50.033, longitude: 8.570 },
            { name: "アムステルダム・スキポール空港", iata_code: "AMS", iso_country: "NL", latitude: 52.308, longitude: 4.764 },
            { name: "マドリード・バラハス空港", iata_code: "MAD", iso_country: "ES", latitude: 40.472, longitude: -3.561 },
            { name: "ローマ・フィウミチーノ空港", iata_code: "FCO", iso_country: "IT", latitude: 41.800, longitude: 12.239 },
            { name: "モスクワ・シェレメーチエヴォ空港", iata_code: "SVO", iso_country: "RU", latitude: 55.972, longitude: 37.414 },
            // 中東・アフリカーーー
            { name: "ドバイ国際空港", iata_code: "DXB", iso_country: "AE", latitude: 25.253, longitude: 55.364 },
            { name: "ハマド国際空港（ドーハ）", iata_code: "DOH", iso_country: "QA", latitude: 25.273, longitude: 51.608 },
            { name: "カイロ国際空港", iata_code: "CAI", iso_country: "EG", latitude: 30.122, longitude: 31.406 },
            { name: "オリバー・タンボ国際空港", iata_code: "JNB", iso_country: "ZA", latitude: -26.139, longitude: 28.246 }
        ];

        // GeoJSON側の3文字国コード(ISO_A3)から、空港側の2文字国コード(ISO_A2)への対応マップ
        const iso3ToIso2 = { "JPN":"JP","KOR":"KR","TWN":"TW","CHN":"CN","HKG":"HK","SGP":"SG","THA":"TH","MYS":"MY","IDN":"ID","PHL":"PH","VNM":"VN","IND":"IN","AUS":"AU","NZL":"NZ","USA":"US","CAN":"CA","MEX":"MX","BRA":"BR","ARG":"AR","GBR":"GB","FRA":"FR","DEU":"DE","NLD":"NL","ESP":"ES","ITA":"IT","RUS":"RU","ARE":"AE","QAT":"QA","EGY":"EG","ZAF":"ZA" };

        // 1. 地図の初期設定（地球儀のように、世界地図を1枚の円形/画面内に収める設定。無限ループしません）
        const map = L.map('map', {
            center: [30, 30],
            zoom: 2,
            minZoom: 2,
            maxZoom: 5,
            maxBounds: [[-85, -180], [85, 180]], // 画面外へのスクロールをロック
            maxBoundsViscosity: 1.0,
            zoomControl: false
        });

        // 2. 空港ピンを出し入れするためのレイヤー
        const airportLayerGroup = L.layerGroup().addTo(map);
        let countriesLayer;

        // 3. マウスの動き（国境の強調、空港ピン連動）を処理する関数
        function onEachCountry(feature, layer) {
            const props = feature.properties;
            
            // 国名と国コード(3文字)を取得し、2文字に変換
            const countryName = props.NAME || props.name || "不明な国";
            const iso3 = feature.id || props.ISO_A3 || "";
            const countryCode = iso3ToIso2[iso3] || iso3.substring(0, 2);

            // マウスに追従する空の吹き出しを事前にセット
            layer.bindTooltip("", { sticky: true });

            layer.on({
                // マウスが国の上に乗ったとき
                mouseover: function(e) {
                    const countryLayer = e.target;
                    
                    // 陸地と海がはっきり分かるよう、乗った国を鮮やかなネオンブルーにライトアップ
                    countryLayer.setStyle({
                        weight: 2,
                        color: '#00aaff',
                        fillColor: '#00aaff',
                        fillOpacity: 0.4
                    });
                    
                    // 前の空港ピンを消去
                    airportLayerGroup.clearLayers();

                    let tooltipContent = `<strong>🌍 ${countryName} (${countryCode})</strong><br>`;

                    // 空港データから該当する国の空港を抽出
                    const localAirports = airportData.filter(ap => ap.iso_country.toUpperCase() === countryCode.toUpperCase());

                    if (localAirports.length > 0) {
                        tooltipContent += `<span style="color:#00ddff; font-weight:bold;">✈️ 主要空港が表示されました</span>`;
                        
                        localAirports.forEach(ap => {
                            // 鮮やかなネオンレッドのサークルピンを作成
                            const marker = L.circleMarker([ap.latitude, ap.longitude], {
                                radius: 6,
                                fillColor: "#ff3300",
                                color: "#ffffff",
                                weight: 2,
                                fillOpacity: 0.9
                            });

                            // ピンのすぐ横に「空港名 [IATA]」を常時表示！
                            marker.bindTooltip(`${ap.name} [${ap.iata_code}]`, {
                                permanent: true,
                                direction: 'right',
                                className: 'airport-label'
                            });

                            airportLayerGroup.addLayer(marker);
                        });
                    } else {
                        tooltipContent += `<span style="color:#888;">※主要空港データ未登録</span>`;
                    }

                    // 吹き出しの中身をリアルタイムに更新
                    countryLayer.setTooltipContent(tooltipContent);
                },

                // マウスが国から離れたとき
                mouseout: function(e) {
                    // 国の色を通常（マットグレー）に戻す
                    countriesLayer.resetStyle(e.target);
                    // 表示した空港ピンをすべて消す
                    airportLayerGroup.clearLayers();
                }
            });
        }

        // 4. 🗺️ 世界すべての国（170カ国以上）が網羅された正確な地図データをロード（CORS制限を完全回避する配信元を使用）
        fetch('https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json')
            .then(response => {
                if (!response.ok) throw new Error('ネットワークエラー');
                return response.json();
            })
            .then(data => {
                countriesLayer = L.geoJSON(data, {
                    style: {
                        weight: 1,
                        color: "#2a3b50",      /* 国境線の色 */
                        fillColor: "#162233",  /* 陸地の色（海とはっきりと区別できるマットグレー） */
                        fillOpacity: 0.9       /* 陸地を不透明にして見やすく */
                    },
                    onEachFeature: onEachCountry
                }).addTo(map);
            })
            .catch(error => {
                console.error('地図データの読み込みに失敗しました。Web上に公開すると解消されます。:', error);
            });

    </script>
</body>
</html>
