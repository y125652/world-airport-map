        html, body {

            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globe-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        path, circle, text, svg { outline: none !important; -webkit-tap-highlight-color: rgba(0,0,0,0); }
        #tooltip {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%); 
            background: rgba(10, 16, 35, 0.95); color: #fff; padding: 10px 30px; border-radius: 30px;
            font-size: 18px; font-weight: bold; border: 1px solid #00f0ff; pointer-events: none; 
            z-index: 1000; display: none; box-shadow: 0 4px 25px rgba(0,240,255,0.4); text-align: center;
        }
    </style>
</head>

        const tcColors = { "TC1": "#5c3d75", "TC2": "#8338ec", "TC3": "#2d6a4f", "unknown": "#4a5768" };
        const width = window.innerWidth, height = window.innerHeight, sensitivity = 0.11; 

        const svg = d3.select("#globe").attr("width", width).attr("height", height);
        const projection = d3.geoOrthographic().scale(280).translate([width / 2, height / 2]);
        const path = d3.geoPath().projection(projection);

        const ocean = svg.append("circle")
            .attr("cx", width / 2).attr("cy", height / 2).attr("r", projection.scale())
            .style("fill", "#111e38").style("stroke", "none");

        const mapGroup = svg.append("g");  
        const pinsGroup = svg.append("g"); 
        let currentActiveCountry = ""; 

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(function(world) {
            const countries = topojson.feature(world, world.objects.countries).features;

            mapGroup.selectAll(".country")
                .data(countries).enter().append("path").attr("class", "country").attr("d", path)
                .style("fill", d => {
                    const config = idToCountryConfig[String(d.id)];
                    return config ? tcColors[config.tc] : tcColors["unknown"];
                })
                .style("stroke", "#192c47").style("stroke-width", "0.8px")
                .on("mouseover", function(event, d) {
                    const name = d.properties.name || "不明な国";
                    const config = idToCountryConfig[String(d.id)];
                    const iso2 = config ? config.iso2 : "";
                    const tcName = config ? config.tc : "その他地域";
                    currentActiveCountry = iso2;

                    d3.select("#tooltip").html(`🌍 ${name} ${iso2 ? '(' + iso2 + ')' : ''} [${tcName}]`).style("display", "block");
                    d3.select(this).style("fill", "#00f0ff");
                    refreshLabels();
                })
                .on("mouseout", function(event, d) {
                    currentActiveCountry = "";
                    d3.select("#tooltip").style("display", "none");
                    const config = idToCountryConfig[String(d.id)];
                    d3.select(this).style("fill", config ? tcColors[config.tc] : tcColors["unknown"]);
                    refreshLabels();
                });

            initAllPins();

            svg.call(d3.drag().on("drag", function(event) {
                const rotate = projection.rotate();
                projection.rotate([rotate[0] + event.dx * sensitivity, rotate[1] - event.dy * sensitivity]);
                refreshAll();
            }));

            svg.call(d3.zoom().scaleExtent([0.5, 8.0]).on("zoom", function(event) {
                projection.scale(280 * event.transform.k);
                refreshAll();
            }));
        });

        function refreshAll() {
            svg.selectAll(".country").attr("d", path);
            ocean.attr("r", projection.scale());
            updatePinsAndLabels();
        }

        function initAllPins() {
            airportData.forEach(ap => {
                const geoPoint = { "type": "Point", "coordinates": [ap.lon, ap.lat] };
                pinsGroup.append("circle")
                    .datum(geoPoint).attr("class", "airport-pin").attr("r", 4.2)
                    .style("fill", "#ff3300").style("stroke", "#ffffff").style("stroke-width", "1.2px");

                pinsGroup.append("text")
                    .datum({ geo: geoPoint, country: ap.country, text: `✈️ ${ap.name} [${ap.iata}]` })
                    .attr("class", "airport-text").text(d => d.text)
                    .attr("dx", 10).attr("dy", 4)
                    .style("fill", "#ffcc00").style("font-size", "16.5px").style("font-weight", "bold")
                    .style("text-shadow", "2px 2px 4px #000, -2px -2px 4px #000").style("display", "none"); 
            });
            updatePinsAndLabels();
        }

        function refreshLabels() {
            const visibleLabels = [];
            pinsGroup.selectAll(".airport-text")
                .style("display", function(d) {
                    const gpath = d3.geoPath().projection(projection);
                    return (gpath(d.geo) && d.country === currentActiveCountry) ? "inline" : "none";
                })
                .each(function(d) {
                    const gpath = d3.geoPath().projection(projection);
                    if (gpath(d.geo) && d.country === currentActiveCountry) {
                        visibleLabels.push({ element: d3.select(this), x: projection(d.geo.coordinates)[0], y: projection(d.geo.coordinates)[1] });
                    }
                });

            if (visibleLabels.length > 1) {
                visibleLabels.sort((a, b) => a.x - b.x);
                for (let i = 0; i < visibleLabels.length; i++) {
                    for (let j = i + 1; j < visibleLabels.length; j++) {
                        if (Math.abs(visibleLabels[i].x - visibleLabels[j].x) < 140 && Math.abs(visibleLabels[i].y - visibleLabels[j].y) < 20) {
                            visibleLabels[j].y = visibleLabels[i].y + 20;
                            visibleLabels[j].element.attr("y", visibleLabels[j].y).attr("dy", 0);
                        }
                    }
                }
            }
        }

        function updatePinsAndLabels() {
            pinsGroup.selectAll(".airport-pin")
                .attr("cx", d => projection(d.coordinates)[0]).attr("cy", d => projection(d.coordinates)[1])
                .style("display", d => d3.geoPath().projection(projection)(d) ? "inline" : "none");

            pinsGroup.selectAll(".airport-text")
                .attr("x", d => projection(d.geo.coordinates)[0]).attr("y", d => projection(d.geo.coordinates)[1]).attr("dy", 4)
                .style("display", function(d) { return (d3.geoPath().projection(projection)(d.geo) && d.country === currentActiveCountry) ? "inline" : "none"; });
                
            if (currentActiveCountry) refreshLabels();
        }

        window.addEventListener("resize", function() {
            const w = window.innerWidth, h = window.innerHeight;
            svg.attr("width", w).attr("height", h); projection.translate([w / 2, h / 2]);
            ocean.attr("cx", w / 2).attr("cy", h / 2); refreshAll();
        });

</html>
