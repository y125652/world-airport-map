<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D世界空港地球儀マップ</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #03030c; /* 宇宙空間 */
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #globe-container {
            width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center;
        }
        /* 国やピンをクリックした際に出る「不快な四角い枠(アウトライン)」を完全に消去 */
        path, circle, text, svg {
            outline: none !important;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        /* 画面中央上部の国名吹き出し */
        #tooltip {
            position: absolute; top: 25px; left: 50%;
            transform: translateX(-50%); background: rgba(10, 16, 36, 0.95);
            color: #fff; padding: 10px 30px; border-radius: 30px;
            font-size: 18px; font-weight: bold; border: 1px solid #00aaff;
            pointer-events: none; z-index: 1000; display: none;
            box-shadow: 0 4px 25px rgba(0,170,255,0.4); text-align: center;
        }
    </style>
</head>
<body>

    <div id="tooltip"></div>
    <div id="globe-container">
        <svg id="globe"></svg>
    </div>

    <script>
        // --- 📊 全世界の主要空港データ ---
        const airportData = [
            // アジア
            { name: "東京国際空港（羽田）", iata: "HND", country: "JP", lat: 35.549, lon: 139.780 },
            { name: "成田国際空港", iata: "NRT", country: "JP", lat: 35.772, lon: 140.393 },
            { name: "関西国際空港", iata: "KIX", country: "JP", lat: 34.432, lon: 135.230 },
            { name: "仁川国際空港", iata: "ICN", country: "KR", lat: 37.460, lon: 126.440 },
            { name: "台湾桃園国際空港", iata: "TPE", country: "TW", lat: 25.079, lon: 121.234 },
            { name: "北京首都国際空港", iata: "PEK", country: "CN", lat: 40.079, lon: 116.603 },
            { name: "上海浦東国際空港", iata: "PVG", country: "CN", lat: 31.144, lon: 121.808 },
            { name: "香港国際空港", iata: "HKG", country: "HK", lat: 22.308, lon: 113.914 },
            { name: "シンガポール・チャンギ空港", iata: "SIN", country: "SG", lat: 1.350, lon: 103.994 },
            { name: "スワンナプーム国際空港", iata: "BKK", country: "TH", lat: 13.690, lon: 100.750 },
            { name: "クアラルンプール国際空港", iata: "KUL", country: "MY", lat: 2.745, lon: 101.709 },
            { name: "スカルノ・ハッタ国際空港", iata: "CGK", country: "ID", lat: -6.125, lon: 106.655 },
            { name: "ニノイ・アキノ国際空港", iata: "MNL", country: "PH", lat: 14.508, lon: 121.011 },
            { name: "ノイバイ国際空港", iata: "HAN", country: "VN", lat: 21.221, lon: 105.807 },
            { name: "インディラ・ガンディー国際空港", iata: "DEL", country: "IN", lat: 28.566, lon: 77.103 },
            // オセアニア
            { name: "シドニー国際空港", iata: "SYD", country: "AU", lat: -33.946, lon: 151.177 },
            { name: "メルボルン空港", iata: "MEL", country: "AU", lat: -37.673, lon: 144.843 },
            { name: "オークランド空港", iata: "AKL", country: "NZ", lat: -37.008, lon: 174.791 },
            // 北米・中南米
            { name: "ジョン・F・ケネディ国際空港", iata: "JFK", country: "US", lat: 40.640, lon: -73.779 },
            { name: "ロサンゼルス国際空港", iata: "LAX", country: "US", lat: 33.942, lon: -118.408 },
            { name: "シカゴ・オヘア国際空港", iata: "ORD", country: "US", lat: 41.974, lon: -87.907 },
            { name: "サンフランシスコ国際空港", iata: "SFO", country: "US", lat: 37.619, lon: -122.375 },
            { name: "トロント・ピアソン国際空港", iata: "YYZ", country: "CA", lat: 43.677, lon: -79.624 },
            { name: "バンクーバー国際空港", iata: "YVR", country: "CA", lat: 49.193, lon: -123.184 },
            { name: "メキシコシティ国際空港", iata: "MEX", country: "MX", lat: 19.436, lon: -99.072 },
            { name: "グアルーリョス国際空港", iata: "GRU", country: "BR", lat: -23.435, lon: -46.473 },
            { name: "ミニストロ・ピスタリーニ国際空港", iata: "EZE", country: "AR", lat: -34.822, lon: -58.535 },
            // ヨーロッパ
            { name: "ロンドン・ヒースロー空港", iata: "LHR", country: "GB", lat: 51.470, lon: -0.454 },
            { name: "パリ＝シャルル・ド・ゴール空港", iata: "CDG", country: "FR", lat: 49.010, lon: 2.550 },
            { name: "フランクフルト空港", iata: "FRA", country: "DE", lat: 50.033, lon: 8.570 },
            { name: "アムステルダム・スキポール空港", iata: "AMS", country: "NL", lat: 52.308, lon: 4.764 },
            { name: "マドリード・バラハス空港", iata: "MAD", country: "ES", lat: 40.472, lon: -3.561 },
            { name: "ローマ・フィウミチーノ空港", iata: "FCO", country: "IT", lat: 41.800, lon: 12.239 },
            { name: "モスクワ・シェレメーチエヴォ空港", iata: "SVO", country: "RU", lat: 55.972, lon: 37.414 },
            // 中東・アフリカ
            { name: "ドバイ国際空港", iata: "DXB", country: "AE", lat: 25.253, lon: 55.364 },
            { name: "ハマド国際空港（ドーハ）", iata: "DOH", country: "QA", lat: 25.273, lon: 51.608 },
            { name: "カイロ国際空港", iata: "CAI", country: "EG", lat: 30.122, lon: 31.406 },
            { name: "オリバー・タンボ国際空港", iata: "JNB", country: "ZA", lat: -26.139, lon: 28.246 }
        ];

        const iso3ToIso2 = { "JPN":"JP","KOR":"KR","TWN":"TW","CHN":"CN","HKG":"HK","SGP":"SG","THA":"TH","MYS":"MY","IDN":"ID","PHL":"PH","VNM":"VN","IND":"IN","AUS":"AU","NZL":"NZ","USA":"US","CAN":"CA","MEX":"MX","BRA":"BR","ARG":"AR","GBR":"GB","FRA":"FR","DEU":"DE","NLD":"NL","ESP":"ES","IT":"IT","RUS":"RU","ARE":"AE","QAT":"QA","EGY":"EG","ZAF":"ZA" };

        // --- 🗺️ 画面サイズと地球儀（球体）の設定 ---
        const width = window.innerWidth;
        const height = window.innerHeight;
        const sensitivity = 0.25; // 🔄 人間のドラッグ感覚に最適化した滑らかな回転感度

        const svg = d3.select("#globe")
            .attr("width", width)
            .attr("height", height);

        // 3D地球儀（正射投影法）の設定
        const projection = d3.geoOrthographic()
            .scale(320) // 地球の大きさ
            .center([0, 0])
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        // 🌊 海のレイヤーを描写（宇宙と区別できる深海ネイビー）
        svg.append("circle")
            .attr("cx", width / 2)
            .attr("cy", height / 2)
            .attr("r", projection.scale())
            .style("fill", "#0a1128")
            .style("stroke", "none");

        const mapGroup = svg.append("g");  // 陸地用のグループ
        const pinsGroup = svg.append("g"); // 空港用のグループ

        let countriesFeatures = [];

        // 4. 世界170カ国以上の正確な国境線データを配信サーバー（GitHub-CDN）から安全にロード
        d3.json("https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json")
            .then(function(data) {
                countriesFeatures = data.features;

                // 陸地の描画
                mapGroup.selectAll(".country")
                    .data(countriesFeatures)
                    .enter().append("path")
                    .attr("class", "country")
                    .attr("d", path)
                    // 視認性の高いマットグレーに配色（海と完全分離）
                    .style("fill", "#1c2d42")
                    .style("stroke", "#2d3f55")
                    .style("stroke-width", "0.8px")
                    
                    // 🔎 マウスカーソルが国に乗ったときの処理
                    .on("mouseover", function(event, d) {
                        const name = d.properties.name || "不明な国";
                        const iso3 = d.id || "";
                        const iso2 = iso3ToIso2[iso3] || iso3.substring(0, 2);

                        // ① 国名をシンプルに中央上にポップアップ（余計な文言は完全排除）
                        d3.select("#tooltip")
                            .html(`🌍 ${name} (${iso2})`)
                            .style("display", "block");

                        // ② その国だけを鮮やかなネオンブルーに強調表示
                        d3.select(this).style("fill", "#00aaff");

                        // ③ その国の空港ピンと空港名テキストを瞬時に浮かび上がらせる
                        showAirports(iso2);
                    })
                    
                    // マウスが国から離れたときの処理
                    .on("mouseout", function() {
                        d3.select("#tooltip").style("display", "none");
                        d3.select(this).style("fill", "#1c2d42"); // 元の陸地色に戻す
                        pinsGroup.selectAll("*").remove(); // ピンを全消去
                    });

                // 5. 🔄 地球儀を直感的にグルグル回すためのドラッグ設定（感度大幅修正版）
                svg.call(d3.drag().on("drag", function(event) {
                    const rotate = projection.rotate();
                    // 感度（sensitivity）を掛け合わせることで、大きく回りすぎるバグを完全解消
                    projection.rotate([
                        rotate[0] + event.dx * sensitivity,
                        rotate[1] - event.dy * sensitivity
                    ]);
                    
                    // 回転に合わせて地球すべての位置を再描写
                    svg.selectAll("path").attr("d", path);
                    svg.select("circle").attr("r", projection.scale());
                    updatePins(); // ピンの位置も地球の回転に追従
                }));
            });

        // 6. 空港ピンと名前テキストを動的に生成する関数
        function showAirports(countryCode) {
            pinsGroup.selectAll("*").remove(); // 初期化

            const localAirports = airportData.filter(ap => ap.country === countryCode);

            localAirports.forEach(ap => {
                const geojsonPoint = { "type": "Point", "coordinates": [ap.lon, ap.lat] };
                
                // 空港のピン（赤いドット）を生成
                const pin = pinsGroup.append("circle")
                    .datum(geojsonPoint)
                    .attr("class", "airport-pin")
                    .attr("r", 5)
                    .style("fill", "#ff3300")
                    .style("stroke", "#ffffff")
                    .style("stroke-width", "1.5px");

                // ピンのすぐ横に出る空港名ラベル（テキスト）を生成
                const label = pinsGroup.append("text")
                    .datum(geojsonPoint)
                    .attr("class", "airport-text")
                    .text(`✈️ ${ap.name} [${ap.iata}]`)
                    .attr("dx", 10)
                    .attr("dy", 5)
                    .style("fill", "#ffaa00")
                    .style("font-size", "12px")
                    .style("font-weight", "bold")
                    .style("text-shadow", "2px 2px 3px #000");
            });

            updatePins();
        }

        // 地球儀の回転に合わせて、空港ピンと文字の位置を三次元的に再計算する関数
        function updatePins() {
            // ドットピンの再計算
            pinsGroup.selectAll(".airport-pin")
                .attr("cx", d => projection(d.coordinates)[0])
                .attr("cy", d => projection(d.coordinates)[1])
                .style("display", d => {
                    // 地球の裏側（隠れている側）にあるピンは自動で非表示にする高度な処理
                    const gpath = d3.geoPath().projection(projection);
                    return gpath(d) ? "inline" : "none";
                });

            // 空港名テキストの再計算
            pinsGroup.selectAll(".airport-text")
                .attr("x", d => projection(d.coordinates)[0])
                .attr("y", d => projection(d.coordinates)[1])
                .style("display", d => {
                    const gpath = d3.geoPath().projection(projection);
                    return gpath(d) ? "inline" : "none";
                });
        }

        // 画面サイズが変更されたときに地球の位置を自動調整
        window.addEventListener("resize", function() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            svg.attr("width", w).attr("height", h);
            projection.translate([w / 2, h / 2]);
            svg.select("circle").attr("cx", w / 2).attr("cy", h / 2);
            svg.selectAll("path").attr("d", path);
            updatePins();
        });

    </script>
</body>
</html>
