<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://unpkg.com/globe.gl@2.26.0/dist/globe.gl.min.js"></script>
</head>
<body>

    <div id="globeViz"></div>

    <script>
        // 地球儀を初期化して画面に表示
        const myGlobe = Globe()(document.getElementById('globeViz'))
            .backgroundColor('#000000') // 背景色を黒に
            .baseColor('#111111')       // 地球のベース色を暗いグレーに
            .showAtmosphere(true)       // 大気圏のエフェクトを有効化
            .atmosphereColor('#3a86ff'); // 大気圏の色を青に

        // カメラの初期距離を設定
        myGlobe.pointOfView({ alt: 2.5 });
    </script>
</body>
</html>
