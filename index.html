    <title>3D Globe with Cargo Airports</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .info-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            display: none;
            z-index: 10;
            transform: translate(15px, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>
</head>

    <div id="info-label" class="info-label"></div>

        container.appendChild(renderer.domElement);

        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        globeGroup.add(sphere);

            { name: "O・R・タンボ国際空港 (JNB)", country: "南アフリカ", lat: -26.1367, lng: 28.2460 },
            { name: "ムルタラ・モハンマド国際空港 (LOS)", country: "ナイジェリア", lat: 6.5774, lng: 3.3210 },
            { name: "ボレ国際空港 (ADD)", country: "エチオピア", lat: 8.9779, lng: 38.7993 },

            // 中南米
            { name: "グアルーリョス国際空港 (GRU)", country: "ブラジル", lat: -23.4356, lng: -46.4731 },
            { name: "ヴィラコッポス国際空港 (VCP)", country: "ブラジル", lat: -23.0074, lng: -47.1344 },
            { name: "ミニストロ・ピスタリーニ国際空港 (EZE)", country: "アルゼンチン", lat: -34.8222, lng: -58.5358 },
            { name: "エルドラド国際空港 (BOG)", country: "コロンビア", lat: 4.7017, lng: -74.1469 },
            { name: "アルトゥーロ・メリノ・ベニテス国際空港 (SCL)", country: "チリ", lat: -33.3930, lng: -70.7858 },
            { name: "ホルヘ・チャベス国際空港 (LIM)", country: "ペルー", lat: -12.0219, lng: -77.1143 },
            { name: "トクメン国際空港 (PTY)", country: "パナマ", lat: 9.0714, lng: -79.3835 },
            { name: "フアン・サンタマリア国際空港 (SJO)", country: "コスタリカ", lat: 9.9939, lng: -84.2089 },
            { name: "ララ・エレーラ国際空港 (UIO)", country: "エクアドル", lat: -0.1228, lng: -78.3575 }
        ];

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (-lng + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.sin(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.cos(theta);

            return new THREE.Vector3(x, y, z);
        }

        const countryMeshes = [];

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(geoJson => {
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
                
                // 通常時は「透明」にして海のベース色を透過させる
                const countryMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x3a86ff, // 地球本来のベースカラー（青）
                    transparent: true, 
                    opacity: 0.0, // 普段は透明にして海の色を出す
                    side: THREE.DoubleSide
                });

                geoJson.features.forEach(feature => {
                    const type = feature.geometry.type;
                    const coordinates = feature.geometry.coordinates;
                    const countryName = feature.properties.NAME_JA || feature.properties.NAME || "Unknown";
                    const isoA2 = feature.properties.ISO_A2 || feature.properties.iso_a2 || "??";

                    if (type === 'Polygon') {
                        createCountrySector(coordinates, lineMaterial, countryMaterial, countryName, isoA2);
                    } else if (type === 'MultiPolygon') {
                        coordinates.forEach(polygon => {
                            createCountrySector(polygon, lineMaterial, countryMaterial, countryName, isoA2);
                        });
                    }
                });
            });

        // earcutライブラリを使用して複雑な多角形を完全に塗りつぶす新アルゴリズム
        function createCountrySector(polygonCoords, lineMat, meshMat, name, iso2) {
            // 外郭線
            const outerCoords = polygonCoords[0];
            const points = [];
            const flatCoords = [];
            const holeIndices = [];

            outerCoords.forEach(coord => {
                const lng = coord[0];
                const lat = coord[1];
                points.push(latLngToVector3(lat, lng, RADIUS + 0.08));
                flatCoords.push(lng, lat);
            });

            // 国境線の描画
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeometry, lineMat);
            globeGroup.add(line);

            // 穴（内包する湖など）がある場合のインデックス処理
            let currentIndex = outerCoords.length;
            for (let i = 1; i < polygonCoords.length; i++) {
                holeIndices.push(currentIndex);
                polygonCoords[i].forEach(coord => {
                    flatCoords.push(coord[0], coord[1]);
                });
                currentIndex += polygonCoords[i].length;
            }

            try {
                // earcut によるポリゴンの三角形分割インデックス計算
                const triangles = earcut(flatCoords, holeIndices, 2);
                if (!triangles || triangles.length === 0) return;

                const vertices = [];
                // フラットな2D経緯度データをすべて3D空間の球面座標にコンバート
                for (let i = 0; i < flatCoords.length; i += 2) {
                    const lng = flatCoords[i];
                    const lat = flatCoords[i + 1];
                    const v3 = latLngToVector3(lat, lng, RADIUS + 0.03);
                    vertices.push(v3.x, v3.y, v3.z);
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setIndex(triangles);
                geometry.computeVertexNormals();

                const countryMesh = new THREE.Mesh(geometry, meshMat.clone());
                countryMesh.userData = { type: 'country', name: name, iso2: iso2 };
                
                globeGroup.add(countryMesh);
                countryMeshes.push(countryMesh);
            } catch (e) {
                // 例外回避用
            }
        }

        const pins = [];
        const pinGeometry = new THREE.SphereGeometry(1.0, 16, 16);
        const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xff3366 }); // ピンの色

        cargoAirports.forEach(airport => {
            const pin = new THREE.Mesh(pinGeometry, pinMaterial);
            const pos = latLngToVector3(airport.lat, airport.lng, RADIUS + 0.4);
            pin.position.copy(pos);
            pin.userData = { type: 'airport', name: airport.name, country: airport.country };
            globeGroup.add(pin);
            pins.push(pin);
        });

        scene.add(globeGroup);
        globeGroup.rotation.y = 2.5;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lastHoveredCountry = null;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const airportIntersects = raycaster.intersectObjects(pins);
            
            if (airportIntersects.length > 0) {
                const data = airportIntersects[0].object.userData;
                labelEl.style.display = 'block';
                labelEl.style.left = `${e.clientX}px`;
                labelEl.style.top = `${e.clientY}px`;
                labelEl.innerHTML = `<strong>${data.name}</strong><br><small>国: ${data.country}</small>`;
                document.body.style.cursor = 'pointer';
                
                if (lastHoveredCountry) {
                    lastHoveredCountry.material.opacity = 0.0;
                    lastHoveredCountry = null;
                }
            } else {
                const countryIntersects = raycaster.intersectObjects(countryMeshes);
                
                if (lastHoveredCountry) {
                    lastHoveredCountry.material.opacity = 0.0;
                    lastHoveredCountry = null;
                }

                if (countryIntersects.length > 0) {
                    const hitCountry = countryIntersects[0].object;
                    const data = hitCountry.userData;
                    
                    labelEl.style.display = 'block';
                    labelEl.style.left = `${e.clientX}px`;
                    labelEl.style.top = `${e.clientY}px`;
                    labelEl.innerHTML = `<strong>${data.name}</strong> (${data.iso2})`;
                    document.body.style.cursor = 'default';

                    // カーソルが乗った時だけ透明度を上げて国全体を浮かび上がらせる（強調表示）
                    hitCountry.material.opacity = 0.4; 
                    lastHoveredCountry = hitCountry;
                } else {
                    labelEl.style.display = 'none';
                    document.body.style.cursor = 'default';
                }
            }

            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            globeGroup.rotation.y += deltaMove.x * 0.005;
            globeGroup.rotation.x += deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('wheel', (e) => {
            currentZoom += e.deltaY * 0.1;
            currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentZoom));
            camera.position.z = currentZoom;
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
